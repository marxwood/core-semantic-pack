id: core.mapping.generic-agentic
version: 0.1.0
status: illustrative
authority: non-authoritative-architecture-mapping
source:
  pack: semantic-pack.core
  version: 0.1.0
mappings:
- architecture_term: agent
  may_realize:
  - Actor
  - Role
  - Capability
  must_preserve:
  - the executing system is not automatically the accountable Actor
  - configured Capability does not imply Authority
  - Role is contextual rather than intrinsic to the model
- architecture_term: human participant
  may_realize:
  - Actor
  - Role
  - Authority
  - Accountability
  must_preserve:
  - human presence does not automatically establish the required Authority
  - Review remains distinct from Binding
- architecture_term: tool or MCP operation
  may_realize:
  - Capability
  - Action
  - Transformation
  - ExternalEffect
  must_preserve:
  - tool availability does not authorize invocation
  - tool output is not Evidence by default
  - successful invocation is not StateChange by itself
  - external effects require explicit authority and attribution
- architecture_term: workflow or orchestration graph
  may_realize:
  - Process
  - Action
  - Transformation
  - Transfer
  - Composition
  may_project_pattern:
  - ExecutionContract
  must_preserve:
  - workflow implementation does not define Process meaning
  - execution ordering does not substitute for an Execution Contract
  - runtime success does not prove Progress
- architecture_term: prompt or instruction
  may_realize:
  - Intent
  - Constraint
  - Contract
  must_preserve:
  - prompt text is not semantic authority by itself
  - hidden prompt objectives must not substitute for an explicit Goal
  - instruction compliance does not establish validity or admission
- architecture_term: conversation or message
  may_realize:
  - Statement
  - Claim
  - Projection
  - Transfer
  must_preserve:
  - message transport does not establish epistemic status
  - a final answer is still a Projection unless separately admitted
  - conversation position does not create authority
- architecture_term: model output
  may_realize:
  - Statement
  - Claim
  - Inference
  - Projection
  must_preserve:
  - model output is not a Finding by default
  - fluency or confidence does not establish validity
  - derived content requires provenance
- architecture_term: retrieval result
  may_realize:
  - Source
  - Observation
  - Derivative
  must_preserve:
  - retrieval result is not Evidence by default
  - source identity, retrieval Context, and provenance must survive
- architecture_term: memory, vector store, graph, database, or conversation state
  may_realize:
  - Persistence
  - State
  may_project_pattern:
  - InstitutionalMemory
  must_preserve:
  - storage does not imply Admission
  - stored text does not become institutional truth
  - semantic type, status, Context, provenance, and version must survive reuse
- architecture_term: validator or evaluator
  may_realize:
  - Validation
  - Validity
  must_preserve:
  - Validation does not imply Admission
  - evaluation scores do not become universal truth
- architecture_term: human-in-the-loop review
  may_realize:
  - Review
  - Contestation
  - Validation
  must_preserve:
  - Review does not imply Binding
  - reviewer identity does not by itself establish the required Authority
- architecture_term: approval mechanism
  may_realize:
  - Binding
  - Commitment
  - Admission
  - Revocation
  must_preserve:
  - the exact authority act and scope are recorded
  - admission and binding remain separate transitions
  - revocation preserves historical reconstruction
- architecture_term: trace, event log, or audit record
  may_realize:
  - Provenance
  - StateChange
  - Accountability
  must_preserve:
  - a log entry is not automatically a StateChange
  - technical trace completeness does not prove semantic completeness
  - semantic release and resolved-pack identity remain traceable
- architecture_term: response schema or generated type
  may_realize:
  - Projection
  - Contract
  - Boundary
  must_preserve:
  - schema conformance does not define meaning
  - generated artifacts remain derivatives of the governed semantic source
mapping_rules:
- many-to-many mappings are permitted
- a mapping must identify the source Core release
- a runtime term may not override Core definitions
- generated artifacts carry no semantic authority by themselves
- implementation changes must preserve mapped distinctions or declare incompatibility
