id: core.question.identify-meaning-context
version: 0.1.0
status: experimental
kind: semantic-question-contract

canonical_question: In which Context does this meaning apply?

family: ontological

requires:
  concepts:
    - Context

  relations:
    - existsIn

must_preserve: []

answer_contract:
  minimum_requirements:
    - applicable_context_identified
    - context_scope_explicit

failure_contract:
  failure_states:
    - implicit_context
    - context_scope_ambiguous

  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
