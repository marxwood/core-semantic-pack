id: core.question.identify-inference
version: 0.1.0
status: experimental
kind: semantic-question-contract

canonical_question: What was inferred?

family: epistemic

requires:
  concepts:
    - Inference
    - Observation
    - Claim
    - Evidence
    - Provenance

  relations:
    - inferredFrom
    - hasProvenance

must_preserve:
  - Inference != Finding

answer_contract:
  minimum_requirements:
    - inference_identified
    - premises_traceable
    - inference_provenance_preserved

failure_contract:
  failure_states:
    - premises_missing
    - inference_promoted_to_finding

  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
