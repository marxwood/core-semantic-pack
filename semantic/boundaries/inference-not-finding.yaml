id: core.boundary.inference-not-finding
version: 0.1.0
status: experimental

expression:
  Inference != Finding

rule: >-
  An Inference must not be represented as a Finding without the declared evaluation, validity, and governance
  conditions required for a Finding.

rationale: >-
  Intermediate reasoning does not silently become a governed result.

failure_code: SEM-BOUNDARY-005
severity: semantic-error

applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
