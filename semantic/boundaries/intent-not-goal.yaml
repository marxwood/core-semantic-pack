id: core.boundary.intent-not-goal
version: 0.1.0
status: experimental

expression:
  Intent != Goal

rule: >-
  Intent must remain traceable to a Goal without being represented as the Goal itself.

rationale: >-
  Immediate purpose and enduring normative objective are different levels.

failure_code: SEM-BOUNDARY-016
severity: semantic-error

applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
