id: core.boundary.claim-not-evidence
version: 0.1.0
status: experimental

expression:
  Claim != Evidence

rule: >-
  A Claim must not be used as Evidence for itself or acquire Evidence status without a declared Admission.

rationale: >-
  Assertions do not provide their own support.

failure_code: SEM-BOUNDARY-003
severity: semantic-error

applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
