id: core.boundary.observation-not-claim
version: 0.1.0
status: experimental

expression:
  Observation != Claim

rule: >-
  An Observation must not be represented as a Claim without an explicit assertion or interpretation transition.

rationale: >-
  Perception and assertion are different epistemic acts.

failure_code: SEM-BOUNDARY-002
severity: semantic-error

applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
