id: core.boundary.action-not-state-change
version: 0.1.0
status: experimental

expression:
  Action != StateChange

rule: >-
  Action must not be represented as StateChange without evidence of an actual attributable transition.

rationale: >-
  Attempted or completed execution is not identical to changed reality.

failure_code: SEM-BOUNDARY-019
severity: semantic-error

applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
