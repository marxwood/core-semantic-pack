id: core.boundary.intent-not-authority
version: 0.1.0
status: experimental

expression:
  Intent != Authority

rule: >-
  Intent must not create Authority or Permission to act.

rationale: >-
  Purpose does not legitimize consequence.

failure_code: SEM-BOUNDARY-017
severity: semantic-error

applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
