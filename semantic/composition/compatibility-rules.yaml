id: core.composition.compatibility-rules
version: 0.1.0
status: experimental

compatibility_classes:
  - id: compatible
    meaning: The composition preserves definitions, boundaries, relation contracts, and question obligations.

  - id: compatible-with-restrictions
    meaning: The composition narrows applicability without changing Core meaning and records all restrictions.

  - id: requires-migration
    meaning: Meaning remains interpretable, but consumers must transform records or mappings before use.

  - id: incompatible
    meaning: The composition would redefine meaning, weaken a boundary, or make historical interpretation
      unsafe.

  - id: unresolved
    meaning: Insufficient information exists to make a compatibility declaration.

change_classification:
  - change: editorial
    semantic_version_effect: patch
    condition: No definition, boundary, relation, obligation, or lifecycle meaning changes.

  - change: compatible-extension
    semantic_version_effect: minor
    condition: Adds records without changing existing meaning or required behavior.

  - change: boundary-clarification
    semantic_version_effect: minor-or-major-after-impact-review
    condition: Makes an existing distinction stricter or more explicit.

  - change: breaking-semantic-change
    semantic_version_effect: major
    condition: Can reinterpret existing records or invalidate a previously valid composition.

required_checks:
  - all referenced Core IDs exist in the required release
  - no Core definition is overridden
  - no Core boundary is weakened or bypassed
  - specializations remain within declared domain boundaries
  - Regime applicability is explicit
  - Execution Contract references an existing Process and sufficient Authority
  - question obligations remain satisfiable
  - historical objects retain their original semantic version

upgrade_rule:
  forbidden: silent latest-version replacement
  required_path:
    - semantic diff
    - impact classification
    - compatibility evaluation
    - consumer or authority decision
    - new immutable resolved pack
