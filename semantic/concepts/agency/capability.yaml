id: core.capability
version: 0.1.0
status: experimental
kind: candidate-core-primitive
layer: agency

symbol: Capability

definition: >-
  A declared ability to perform an operation, transformation, interpretation, or other class of work.

not_equivalent_to:
  - Authority
  - Permission
  - Intent

exclusions:
  - Capability is not successful execution.

required_relations: []

conditional_relations:
  - heldBy
  - constrainedBy
  - existsIn
  - versionedBy

boundaries:
  - Capability != Authority

derivation:
  source: CORE-SEMANTIC-PACK.md
  status: working-reference

  rationale: >-
    Ability must remain separate from legitimacy; increasing capability must not silently expand authority.
