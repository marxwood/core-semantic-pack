id: core.inference
version: 0.1.0
status: experimental
kind: candidate-core-primitive
layer: epistemic

symbol: Inference

definition: >-
  A Derivative conclusion produced by reasoning from one or more Observations, Claims, Evidence objects,
  Findings, or prior Inferences.

helps_answer:
  - What was inferred?

not_equivalent_to:
  - Evidence
  - Binding

exclusions:
  - Inference is not a Finding by default.
  - Inference is not maintained State.

required_relations:
  - inferredFrom
  - hasProvenance

conditional_relations:
  - producedBy
  - hasUncertainty
  - hasValidity
  - contestedBy

boundaries:
  - Inference != Finding
  - Persistence != Admission

derivation:
  source: CORE-SEMANTIC-PACK.md
  status: working-reference

  rationale: >-
    Intermediate reasoning must retain provisional status and cannot become institutional truth merely
    by being stored or reused.
