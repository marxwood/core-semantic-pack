id: core.regime.open
version: 0.1.0
status: exploratory
kind: canonical-regime-definition-with-exploratory-matrix

symbol: OpenRegime

canonical_name: Open
canonical_summary: >-
  Admits broad claim types, uses low barriers for inclusion, and tolerates
  uncertainty where exploration matters more than stability.

purpose: >-
  Exploration, hypothesis generation, early discovery, and plural candidate
  retention.

authority:
  regime_identity: canon-derived
  canonical_summary: canon-derived
  enumerative_matrix: exploratory-derivation-candidate
  may_be_redefined_by_domain: false
  may_be_redefined_by_execution_contract: false

matrix:
  claim_classes:
    admissible:
      - Statement
      - Observation
      - Claim
      - Inference
      - Finding
    restrictions:
      - Findings remain explicitly provisional unless a stricter Regime evaluates them.
      - Unsupported Claims may exist as candidates but may not be projected as maintained truth.
      - Projection is not an admissible Claim class.

  evidence_classes:
    core_class: Evidence
    domain_specializations: allowed only through explicit Core-compatible mapping
    minimum: >-
      Evidence is not required for candidate inclusion, but is required for any
      assertion of support or maintenance.
    provenance: >-
      Origin must be declared when known; missing provenance must be explicit
      rather than silently omitted.
    additional_requirements:
      - Raw source material remains distinct from admitted Evidence.
      - Unknown and ungrounded states remain visible.

  evaluation_rules:
    admission: >-
      Broad candidate admission is allowed when semantic and Regime context are declared.
    support: >-
      Support may be partial, preliminary, or absent; absence must remain explicit.
    contradiction: >-
      Contradictory candidates may coexist without forced resolution.
    uncertainty: >-
      High uncertainty is tolerated and must be represented.
    trace: >-
      A minimal trace of assertion, source availability, Regime, and time is retained.
    outcomes:
      - maintained
      - contested
      - invalidated
      - retired

  invalidation_rules:
    triggers:
      - known fabrication
      - provenance represented as present when it is absent
      - semantic-context mismatch
      - use outside the declared exploratory scope
      - silent promotion into maintained or binding state
    preserve_referability: true
    preserve_trace: true
    deletion_is_invalidation: false

  escalation_rules:
    triggers:
      - the Claim will persist as reusable maintained knowledge
      - the Claim becomes a dependency for consequential downstream action
      - material contradiction requires structured resolution
      - the cost of error exceeds exploratory tolerance
    candidate_targets:
      - core.regime.disciplined
      - core.regime.adversarial
      - core.regime.high-assurance
    explicit_switch_required: true
    prior_outcomes_retained: true

invariants:
  - Regime does not redefine semantic meaning.
  - Admission into the system is not a declaration of truth.
  - Validity remains Regime-scoped and time-scoped.
  - Contradiction remains visible.
  - Invalidation preserves referability and trace.
  - Exploration does not lower the boundaries between Claim, Evidence, Finding, Projection, and State.

derivation:
  canonical_source: system-momentum-canon/core/authority/regimes.md
  validity_source: system-momentum-canon/core/authority/validity.md
  interpretation_source: system-momentum-canon/core/authority/interpretation.md
  exploration_source: February 2026 Regime ontology and enumerative matrices
  review_target: candidate future Canon elaboration
  note: >-
    The canonical identity and summary are authoritative only to the extent of
    the cited Canon. The detailed matrix is retained as a reviewable exploration
    candidate.
