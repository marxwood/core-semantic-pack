id: core.regime.high-assurance
version: 0.1.0
status: exploratory
kind: canonical-regime-definition-with-exploratory-matrix

symbol: HighAssuranceRegime

canonical_name: High-Assurance
canonical_summary: >-
  Uses strict admissibility, strong Evidence classes, and explicit evaluation
  trails for high-stakes downstream decisions.

purpose: >-
  High-consequence analysis, safety-critical or legally material evaluation,
  and durable institutional decisions.

authority:
  regime_identity: canon-derived
  canonical_summary: canon-derived
  enumerative_matrix: exploratory-derivation-candidate
  may_be_redefined_by_domain: false
  may_be_redefined_by_execution_contract: false

matrix:
  claim_classes:
    admissible:
      - Observation
      - Claim
      - Inference
      - Finding
    restrictions:
      - Every Inference and Finding is grounded in an explicit evaluation procedure.
      - Ungrounded Claims cannot receive a maintained outcome.
      - Domain specializations declare their assurance-relevant Evidence class mapping.

  evidence_classes:
    core_class: Evidence
    domain_specializations: allowed only through explicit Core-compatible mapping
    minimum: >-
      Multiple independently sourced or methodologically independent Evidence
      items are expected unless an explicit exception is authorized and recorded.
    provenance: >-
      Complete Provenance and chain-of-custody or transformation trace are mandatory.
    additional_requirements:
      - Corroboration across independent Evidence sources or classes.
      - Explicit criteria and reproducible procedure.
      - Independent Review where the Execution Contract requires it.
      - Review remains distinct from Binding.

  evaluation_rules:
    admission: >-
      Admission requires strict conformance to the declared Evidence policy and
      evaluation procedure.
    support: >-
      Support must satisfy explicit criteria and independence requirements.
    contradiction: >-
      Decisive contradiction invalidates or contests the Claim; unresolved
      material contradiction cannot be hidden.
    uncertainty: >-
      Uncertainty thresholds and exception handling are explicit.
    trace: >-
      A complete, independently inspectable evaluation trail is required.
    outcomes:
      - maintained
      - contested
      - invalidated
      - retired

  invalidation_rules:
    triggers:
      - provenance or chain-of-custody failure
      - evaluation-procedure violation
      - insufficient independent corroboration
      - decisive contradiction
      - undeclared exception
      - semantic or Regime context mismatch
      - non-reconstructable evaluation trail
    preserve_referability: true
    preserve_trace: true
    deletion_is_invalidation: false

  escalation_rules:
    triggers:
      - the result will become a canonical or institutional baseline
      - changes must occur only through tightly governed procedures
      - the artifact is intended as a long-lived public reference
    candidate_targets:
      - core.regime.locked
    explicit_switch_required: true
    prior_outcomes_retained: true

invariants:
  - Regime does not redefine semantic meaning.
  - Admission into the system is not a declaration of truth.
  - Validity remains Regime-scoped and time-scoped.
  - Contradiction remains visible.
  - Invalidation preserves referability and trace.
  - Technical or procedural success does not substitute for Evidence sufficiency.

derivation:
  canonical_source: system-momentum-canon/core/authority/regimes.md
  validity_source: system-momentum-canon/core/authority/validity.md
  interpretation_source: system-momentum-canon/core/authority/interpretation.md
  exploration_source: February 2026 Regime ontology and enumerative matrices
  review_target: candidate future Canon elaboration
  note: >-
    The canonical identity and summary are authoritative only to the extent of
    the cited Canon. The detailed matrix is retained as a reviewable exploration
    candidate.
