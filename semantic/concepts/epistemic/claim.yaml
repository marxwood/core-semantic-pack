id: core.claim
version: 0.1.0
status: experimental
kind: candidate-core-primitive
layer: epistemic

symbol: Claim

definition: >-
  A Statement asserted as being possibly true or false about an Entity, State, Relation, or condition
  under a declared Context.

not_equivalent_to:
  - Evidence

exclusions:
  - Claim is not truth.
  - Claim is not a Finding.
  - Claim is not maintained State by default.

required_relations:
  - assertedBy
  - existsIn

conditional_relations:
  - supportedBy
  - contradictedBy
  - hasProvenance
  - hasUncertainty
  - hasValidity
  - contestedBy

boundaries:
  - Claim != Evidence
  - Evidence != Truth

derivation:
  source: CORE-SEMANTIC-PACK.md
  status: working-reference

  rationale: >-
    Assertions must retain their epistemic status rather than becoming true through fluency, repetition,
    or persistence.
