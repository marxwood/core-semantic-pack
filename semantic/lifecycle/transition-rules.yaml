id: core.lifecycle.transition-rules
version: 0.1.0
status: experimental

requirements_for_material_transition:
  - source object or status is identified
  - resulting object or status is identified
  - transition is attributable
  - governing Context is identified
  - semantic version is retained
  - provenance and rationale are retained
  - required Authority is traceable when the transition changes admission or binding
  - revocation and supersession preserve historical reconstructability

families:
  - family: ConceptAuthorityStatus

    allowed:
      - proposed -> experimental
      - proposed -> rejected
      - experimental -> adopted
      - experimental -> restricted
      - experimental -> rejected
      - adopted -> restricted
      - adopted -> deprecated
      - adopted -> superseded
      - restricted -> adopted
      - restricted -> deprecated
      - deprecated -> retired
      - deprecated -> superseded
      - superseded -> retired

    requires_authority: true

  - family: EpistemicStatus

    allowed:
      - candidate -> supported
      - candidate -> contradicted
      - candidate -> mixed
      - candidate -> contested
      - supported -> mixed
      - supported -> contradicted
      - supported -> contested
      - contradicted -> mixed
      - contradicted -> supported
      - contradicted -> contested
      - mixed -> supported
      - mixed -> contradicted
      - mixed -> contested
      - '* -> invalidated'
      - '* -> superseded'
      - '* -> retired'

    requires_authority: false
    requires_evidence_or_contestation: true

  - family: ValidityStatus

    allowed:
      - unassessed -> valid-under-context
      - unassessed -> conditionally-valid
      - unassessed -> invalid
      - valid-under-context -> conditionally-valid
      - valid-under-context -> invalid
      - valid-under-context -> contested
      - conditionally-valid -> valid-under-context
      - conditionally-valid -> invalid
      - conditionally-valid -> expired
      - '* -> contested'
      - '* -> revoked'

    requires_validation: true

  - family: AdmissionStatus

    allowed:
      - not-evaluated -> pending
      - pending -> admitted
      - pending -> rejected
      - admitted -> revoked
      - admitted -> superseded

    requires_admission: true
    requires_authority: true

  - family: BindingStatus

    allowed:
      - non-binding -> proposed
      - proposed -> binding
      - proposed -> non-binding
      - binding -> suspended
      - suspended -> binding
      - binding -> revoked
      - binding -> superseded
      - binding -> expired

    requires_binding_or_revocation: true
    requires_authority: true

forbidden_implicit_transitions:
  - trigger: Persistence
    must_not_imply: Admission
    boundary: Persistence != Admission

  - trigger: Validation
    must_not_imply: Admission
    boundary: Validation != Admission

  - trigger: Review
    must_not_imply: Binding
    boundary: Review != Binding

  - trigger: Repetition
    must_not_imply: Validation
    boundary: Repetition != Validation
    trigger_context: Downstream reuse is included in this trigger.
    additional_prohibition: Downstream reuse must not imply epistemic Support.

  - trigger: Capability
    must_not_imply: Authority
    boundary: Capability != Authority
    trigger_context: Capability availability is the triggering condition.

  - trigger: Projection
    must_not_imply: State
    boundary: Projection != State
    trigger_context: Projection visibility is the triggering condition.

  - trigger: OperationalSuccess
    must_not_imply: Progress
    boundary: OperationalSuccess != Progress
