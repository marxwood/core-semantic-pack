    target: provenance:report

  - relation: existsIn
    source: projection:recommendation-report
    target: context:customer-facing

expectations:
  rules_pass:
    - DerivedObjectProvenance
    - ProjectionNonAuthoritative
  rules_fail: []
  boundaries_triggered: []
