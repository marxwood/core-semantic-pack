id: core.conformance.rule-catalog
version: 0.1.0
status: experimental

rules:
  - id: core.rule.known-semantic-references
    version: 0.1.0
    status: experimental

    symbol: KnownSemanticReferences

    scope:
      category: pack-structure

    requirement: >-
      Every Core concept, relation, boundary, question, pattern, and rule reference resolves within the declared
      release.

    failure: unresolved-semantic-reference

  - id: core.rule.derived-object-provenance
    version: 0.1.0
    status: experimental

    symbol: DerivedObjectProvenance

    scope:
      types:
        - Derivative
        - Projection
        - Inference
        - Finding
        - Evidence

    requirement: >-
      Every material derived object retains explicit Provenance and a derivation path.

    required_relations:
      - hasProvenance

    failure: detached-derivative

  - id: core.rule.evidence-admitted-and-provenanced
    version: 0.1.0
    status: experimental

    symbol: EvidenceAdmittedAndProvenanced

    scope:
      types:
        - Evidence

    requirement: >-
      Evidence has Provenance, exists in a declared Context, is admitted by an explicit Admission, and supports
      or contradicts at least one Claim.

    required_relations:
      - hasProvenance
      - existsIn
      - admittedBy
    requires_one_of_relations:
      - supports
      - contradicts

    boundaries:
      - Claim != Evidence
      - Evidence != Truth
      - Validation != Admission

    failure: ungoverned-evidence-status

  - id: core.rule.finding-governed
    version: 0.1.0
    status: experimental

    symbol: FindingGoverned

    scope:
      types:
        - Finding

    requirement: >-
      A Finding retains derivation, Provenance, and contextual Validity and remains non-binding unless a separate
      Binding occurs.

    required_relations:
      - derivedFrom
      - hasProvenance
      - hasValidity

    boundaries:
      - Inference != Finding
      - Finding != BindingDecision

    failure: ungoverned-finding

  - id: core.rule.projection-non-authoritative
    version: 0.1.0
    status: experimental

    symbol: ProjectionNonAuthoritative

    scope:
      types:
        - Projection

    requirement: >-
      A Projection identifies what it projects and retains Provenance without being represented as Source,
      maintained State, Admission, or Binding.

    required_relations:
      - projects
      - hasProvenance

    boundaries:
      - Source != Projection
      - Projection != State

    failure: projection-collapse

  - id: core.rule.action-purpose-chain
    version: 0.1.0
    status: experimental

    symbol: ActionPurposeChain

    scope:
      types:
        - Action

    requirement: >-
      A material Action is attributable to an Actor, realizes an Intent, participates in a Process, and its
      Intent advances an authorized Goal specifying a DesiredState.

    required_relations:
      - performedBy
      - realizes
      - participatesIn
    required_chain:
      - source: Action
        relation: realizes
        target: Intent

      - source: Intent
        relation: advances
        target: Goal

      - source: Goal
        relation: specifies
        target: DesiredState

      - source: Goal
        relation: authorizedBy
        target: Authority

    boundaries:
      - Action != Intent
      - Intent != Goal
      - Goal != DesiredState

    failure: detached-action-purpose

  - id: core.rule.external-effect-authorized
    version: 0.1.0
    status: experimental

    symbol: ExternalEffectAuthorized

    scope:
      types:
        - ExternalEffect

    requirement: >-
      An ExternalEffect is attributable, explicitly authorized, governed by an applicable Contract, and linked
      to resulting State.

    required_relations:
      - authorizedBy
      - governedBy
      - resultingState
      - hasProvenance

    failure: unauthorized-external-effect

  - id: core.rule.state-change-reconstructable
    version: 0.1.0
    status: experimental

    symbol: StateChangeReconstructable

    scope:
      types:
        - StateChange

    requirement: >-
      A StateChange identifies previous and resulting State, exists in Context, and retains an attributable
      cause or Provenance.

    required_relations:
      - previousState
      - resultingState
      - existsIn
    requires_one_of_relations:
      - causedBy
      - hasProvenance

    boundaries:
      - Action != StateChange

    failure: unreconstructable-state-change

  - id: core.rule.admission-explicit
    version: 0.1.0
    status: experimental

    symbol: AdmissionExplicit

    scope_description: Maintained governed State.

    requirement: >-
      An admitted object or resulting maintained State traces to an explicit, authorized Admission; Persistence
      and Validation cannot substitute.

    required_concepts:
      - Admission
      - Authority
    required_relations:
      - admittedBy
      - authorizedBy

    boundaries:
      - Validation != Admission
      - Persistence != Admission

    failure: implicit-admission

  - id: core.rule.binding-explicit
    version: 0.1.0
    status: experimental

    symbol: BindingExplicit

    scope_description: Institutional commitment.

    requirement: >-
      An operative Commitment traces to a separate authorized Binding act; Review, Finding, or visibility
      cannot substitute.

    required_concepts:
      - Binding
      - Authority
      - Commitment
    required_relations:
      - establishesCommitment
      - authorizedBy

    boundaries:
      - Review != Binding
      - Finding != BindingDecision

    failure: implicit-binding

  - id: core.rule.capability-authority-separation
    version: 0.1.0
    status: experimental

    symbol: CapabilityAuthoritySeparation

    scope:
      types:
        - Action
        - ExternalEffect
        - Permission

    requirement: >-
      Capability may explain what can be performed but never satisfies a required Authority relation.

    boundaries:
      - Capability != Authority

    failure: capability-used-as-authority

  - id: core.rule.inference-cannot-be-maintained-without-admission
    version: 0.1.0
    status: experimental

    symbol: InferenceCannotBecomeMaintainedWithoutAdmission

    scope:
      types:
        - Inference

    requirement: >-
      An Inference must not become maintained State through Persistence or downstream reuse without explicit
      epistemic evaluation and Admission.

    boundaries:
      - Inference != Finding
      - Persistence != Admission
      - Repetition != Validation

    failure: inference-promoted-to-maintained-state

  - id: core.rule.review-cannot-substitute-binding
    version: 0.1.0
    status: experimental

    symbol: ReviewCannotSubstituteBinding

    scope:
      types:
        - Review

    requirement: >-
      Review may validate, contest, annotate, or recommend but cannot establish an operative Commitment without
      a separate Binding.

    boundaries:
      - Review != Binding

    failure: review-used-as-binding

  - id: core.rule.execution-contract-required
    version: 0.1.0
    status: experimental

    symbol: ExecutionContractRequired

    scope_description: Legitimate Process realization.

    requirement: >-
      Concrete execution legitimacy derives from an applicable Execution Contract pattern, not from an ExecutionPlan,
      workflow graph, or runtime configuration.

    required_pattern: ExecutionContract

    boundaries:
      - Process != ExecutionContract
      - ExecutionContract != ExecutionPlan
      - ExecutionPlan != Runtime

    failure: execution-legitimacy-inferred-from-implementation

  - id: core.rule.goal-progress-independent
    version: 0.1.0
    status: experimental

    symbol: GoalProgressIndependent

    scope:
      types:
        - Action
        - StateChange
        - Progress

    requirement: >-
      Progress is evaluated against DesiredState and must not be inferred from Action completion or operational
      success.

    required_relations:
      - evaluatedAgainst

    boundaries:
      - OperationalSuccess != Progress

    failure: operational-success-used-as-goal-progress

  - id: core.rule.semantic-version-retained
    version: 0.1.0
    status: experimental

    symbol: SemanticVersionRetained

    scope_description: Historically material semantic objects.

    requirement: >-
      The semantic version and resolved-pack identity governing historical interpretation remain reconstructable.

    required_relations:
      - versionedBy

    failure: historical-meaning-unversioned

  - id: core.rule.resolved-pack-immutable
    version: 0.1.0
    status: experimental

    symbol: ResolvedPackImmutable

    scope:
      category: resolved-semantic-pack

    requirement: >-
      A resolved pack records exact component versions and checksum and does not float to latest versions.

    failure: mutable-semantic-environment

  - id: core.rule.answerability-gates-consequence
    version: 0.1.0
    status: experimental

    symbol: AnswerabilityGatesConsequence

    scope_description: Material Action or ExternalEffect.

    requirement: >-
      When required question contracts cannot be answered, the declared consequence policy is applied; unresolved
      Authority or Goal forbids ExternalEffect.

    failure: consequence-despite-unresolved-answerability
