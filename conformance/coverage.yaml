known_gaps:
- Ontological identity continuity across representation changes requires a multi-version fixture.
- Revocation and supersession require end-to-end lifecycle fixtures.
- Question coverage is representative rather than exhaustive for every canonical wording.
- Runtime behavioral enforcement remains outside the structural validator.
