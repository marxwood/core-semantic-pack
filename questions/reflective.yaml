id: core.question-family.reflective
version: 0.1.0
status: experimental
family: reflective
canonical_questions:
- Has the Goal changed?
- Is the Goal still authorized?
- Has CurrentState changed materially?
- Has our Interpretation changed?
- Is the system still moving toward DesiredState?
- Has new Evidence contradicted a maintained Finding?
- Did an intermediate Inference silently become institutional truth?
- Should maintained State or Binding be revised or revoked?
requires_concepts:
- core.goal
- core.state
- core.desired-state
- core.progress
- core.interpretation
- core.evidence
- core.finding
- core.inference
- core.contestation
- core.revocation
- core.semantic-version
requires_relations:
- core.rel.supersedes
- core.rel.evaluated-against
- core.rel.contradicts
- core.rel.contested-by
- core.rel.revokes-object
- core.rel.versioned-by
must_preserve:
- core.boundary.repetition-not-validation
- core.boundary.inference-not-finding
- core.boundary.persistence-not-admission
- core.boundary.operational-success-not-goal-progress
answer_requirements:
- goal_version_comparable
- state_change_visible
- contradictions_preserved
- status_promotion_traceable
- revision_or_revocation_available
failure_states:
- goal_drift_untracked
- semantic_status_collapse
- contradiction_suppressed
- irreversible_binding
consequence_on_failure:
  autonomy: reduce
  binding: requires_review
  external_effect: requires_escalation
