id: core.question.classify-semantic-kind
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What kind of thing is it?
classification:
  primary_family: core.question-family.ontological
  families:
  - core.question-family.ontological
requires:
  concepts:
  - core.entity
  - core.context
  relations:
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - semantic_kind_declared
  - classification_context_explicit
failure_contract:
  failure_states:
  - unclassified_referent
  - classification_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
