id: core.question.identify-pursued-goal
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which Goal is being pursued?
classification:
  primary_family: core.question-family.teleological
  families:
  - core.question-family.teleological
  - core.question-family.governance
requires:
  concepts:
  - core.goal
  - core.intent
  - core.action
  - core.authority
  relations:
  - core.rel.advances
  - core.rel.realizes
  - core.rel.authorized-by
must_preserve:
  boundaries:
  - core.boundary.intent-not-goal
  - core.boundary.intent-not-authority
answer_contract:
  minimum_requirements:
  - goal_identified
  - intent_to_goal_relation_traceable
  - goal_authority_traceable
failure_contract:
  failure_states:
  - unresolved_goal
  - goal_authority_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
