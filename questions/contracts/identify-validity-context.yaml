id: core.question.identify-validity-context
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Under which Context is this valid?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
  - core.question-family.governance
requires:
  concepts:
  - core.validity
  - core.context
  - core.provenance
  relations:
  - core.rel.has-validity
  - core.rel.exists-in
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.evidence-not-truth
answer_contract:
  minimum_requirements:
  - validity_status_identified
  - validity_context_explicit
  - validity_provenance_traceable
failure_contract:
  failure_states:
  - contextual_validity_universalized
  - validity_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
