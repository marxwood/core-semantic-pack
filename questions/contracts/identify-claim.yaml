id: core.question.identify-claim
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What is being claimed?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
requires:
  concepts:
  - core.claim
  - core.actor
  - core.source
  - core.provenance
  - core.context
  relations:
  - core.rel.asserted-by
  - core.rel.has-provenance
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.observation-not-claim
  - core.boundary.claim-not-evidence
answer_contract:
  minimum_requirements:
  - claim_identified
  - assertion_attributable
  - provenance_traceable
  - claim_context_explicit
failure_contract:
  failure_states:
  - claim_unattributed
  - claim_used_as_evidence
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
