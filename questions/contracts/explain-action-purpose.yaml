id: core.question.explain-action-purpose
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Why is this being done?
classification:
  primary_family: core.question-family.teleological
  families:
  - core.question-family.teleological
  - core.question-family.agency
  - core.question-family.governance
requires:
  concepts:
  - core.action
  - core.intent
  - core.goal
  - core.desired-state
  - core.authority
  - core.context
  relations:
  - core.rel.realizes
  - core.rel.advances
  - core.rel.specifies
  - core.rel.authorized-by
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.action-not-intent
  - core.boundary.intent-not-goal
  - core.boundary.intent-not-authority
  - core.boundary.capability-not-authority
answer_contract:
  minimum_requirements:
  - action_identified
  - intent_identified
  - goal_identified
  - desired_state_identified
  - authority_traceable
failure_contract:
  failure_states:
  - unresolved_intent
  - unresolved_goal
  - missing_desired_state
  - unresolved_authority
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: external-effect-forbidden-until-resolved
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
