id: core.question.identify-derived-finding
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What Finding was derived?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
requires:
  concepts:
  - core.finding
  - core.inference
  - core.evidence
  - core.provenance
  - core.validity
  relations:
  - core.rel.derived-from
  - core.rel.supported-by
  - core.rel.has-provenance
  - core.rel.has-validity
must_preserve:
  boundaries:
  - core.boundary.inference-not-finding
  - core.boundary.finding-not-binding-decision
answer_contract:
  minimum_requirements:
  - finding_identified
  - derivation_traceable
  - support_traceable
  - validity_status_explicit
failure_contract:
  failure_states:
  - finding_without_derivation
  - inference_silently_promoted
  - finding_used_as_binding_decision
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
