id: core.question.identify-action-process
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which Process does it participate in?
classification:
  primary_family: core.question-family.agency
  families:
  - core.question-family.agency
requires:
  concepts:
  - core.action
  - core.process
  relations:
  - core.rel.participates-in
must_preserve:
  boundaries:
  - core.boundary.process-not-execution-contract
answer_contract:
  minimum_requirements:
  - action_identified
  - process_identified
  - participation_relation_traceable
failure_contract:
  failure_states:
  - process_missing
  - process_collapsed_with_execution_contract
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
