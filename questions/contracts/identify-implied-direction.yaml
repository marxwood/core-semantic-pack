id: core.question.identify-implied-direction
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which direction of change follows from it?
classification:
  primary_family: core.question-family.teleological
  families:
  - core.question-family.teleological
requires:
  concepts:
  - core.goal
  - core.direction
  - core.state
  - core.desired-state
  relations:
  - core.rel.implies-direction
  - core.rel.from-state
  - core.rel.toward-state
must_preserve:
  boundaries:
  - core.boundary.goal-not-desired-state
answer_contract:
  minimum_requirements:
  - goal_identified
  - direction_identified
  - origin_state_identified
  - target_desired_state_identified
failure_contract:
  failure_states:
  - direction_missing
  - origin_or_target_state_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
