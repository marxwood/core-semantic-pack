id: core.question.detect-projection-admitted-as-state
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Has a Projection silently become accepted as State?
classification:
  primary_family: core.question-family.interpretive
  families:
  - core.question-family.interpretive
  - core.question-family.reflective
  - core.question-family.memory
  - core.question-family.governance
requires:
  concepts:
  - core.projection
  - core.state
  - core.admission
  - core.persistence
  - core.provenance
  relations:
  - core.rel.projects
  - core.rel.admitted-by
  - core.rel.persists-object
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.projection-not-state
  - core.boundary.persistence-not-admission
answer_contract:
  minimum_requirements:
  - projection_identified
  - state_identified
  - admission_transition_traceable_if_present
  - persistence_distinguished_from_admission
failure_contract:
  failure_states:
  - projection_collapse
  - persistence_used_as_admission
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
