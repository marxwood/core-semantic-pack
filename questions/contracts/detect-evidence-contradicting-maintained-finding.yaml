id: core.question.detect-evidence-contradicting-maintained-finding
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Has new Evidence contradicted a maintained Finding?
classification:
  primary_family: core.question-family.reflective
  families:
  - core.question-family.reflective
  - core.question-family.epistemic
  - core.question-family.memory
requires:
  concepts:
  - core.evidence
  - core.finding
  - core.contradiction
  - core.provenance
  - core.admission
  relations:
  - core.rel.contradicts
  - core.rel.has-provenance
  - core.rel.admitted-by
must_preserve:
  boundaries:
  - core.boundary.evidence-not-truth
  - core.boundary.inference-not-finding
answer_contract:
  minimum_requirements:
  - maintained_finding_identified
  - new_evidence_identified
  - contradiction_relation_evaluated
  - provenance_preserved
failure_contract:
  failure_states:
  - contradicting_evidence_ignored
  - finding_status_not_revisited
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
