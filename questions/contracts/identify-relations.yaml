id: core.question.identify-relations
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: To what is it related?
classification:
  primary_family: core.question-family.ontological
  families:
  - core.question-family.ontological
requires:
  concepts:
  - core.entity
  - core.relation
  - core.context
  relations:
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - relevant_relations_identified
  - relation_context_explicit
failure_contract:
  failure_states:
  - relation_semantics_missing
  - relation_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
