id: core.question.identify-producing-interpretation
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which interpretation of reality produced this conclusion?
classification:
  primary_family: core.question-family.interpretive
  families:
  - core.question-family.interpretive
requires:
  concepts:
  - core.interpretation
  - core.context
  - core.provenance
  - core.actor
  relations:
  - core.rel.interprets
  - core.rel.performed-by
  - core.rel.exists-in
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.source-not-projection
answer_contract:
  minimum_requirements:
  - interpretation_identified
  - interpreted_object_traceable
  - interpretive_actor_or_role_known
  - context_explicit
  - provenance_preserved
failure_contract:
  failure_states:
  - interpretation_implicit
  - interpretive_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
