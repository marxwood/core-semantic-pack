id: core.question.identify-derivation-source
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What Source or State does it derive from?
classification:
  primary_family: core.question-family.interpretive
  families:
  - core.question-family.interpretive
requires:
  concepts:
  - core.derivative
  - core.projection
  - core.source
  - core.state
  - core.provenance
  relations:
  - core.rel.derived-from
  - core.rel.projects
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.source-not-projection
  - core.boundary.projection-not-state
answer_contract:
  minimum_requirements:
  - derived_object_identified
  - source_or_state_traceable
  - provenance_preserved
failure_contract:
  failure_states:
  - source_detached
  - projection_collapse
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
