id: core.question.identify-memory-eligibility
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What should the system remember?
classification:
  primary_family: core.question-family.memory
  families:
  - core.question-family.memory
  - core.question-family.governance
requires:
  concepts:
  - core.persistence
  - core.admission
  - core.context
  - core.state
  relations:
  - core.rel.persists-object
  - core.rel.admitted-by
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.persistence-not-admission
answer_contract:
  minimum_requirements:
  - candidate_for_persistence_identified
  - persistence_policy_or_eligibility_explicit
  - admission_status_preserved
  - context_explicit
failure_contract:
  failure_states:
  - persistence_used_as_admission
  - eligibility_implicit
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
