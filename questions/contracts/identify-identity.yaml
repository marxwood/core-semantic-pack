id: core.question.identify-identity
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which identity does it have?
classification:
  primary_family: core.question-family.ontological
  families:
  - core.question-family.ontological
requires:
  concepts:
  - core.entity
  - core.identity
  relations:
  - core.rel.has-identity
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - identity_criteria_identified
  - identity_bound_to_referent
failure_contract:
  failure_states:
  - identity_missing
  - identity_ambiguous
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
