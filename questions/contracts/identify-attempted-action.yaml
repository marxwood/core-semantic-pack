id: core.question.identify-attempted-action
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which Action is being attempted?
classification:
  primary_family: core.question-family.agency
  families:
  - core.question-family.agency
requires:
  concepts:
  - core.action
  - core.actor
  - core.intent
  - core.process
  - core.provenance
  relations:
  - core.rel.performed-by
  - core.rel.realizes
  - core.rel.participates-in
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.action-not-intent
  - core.boundary.action-not-state-change
answer_contract:
  minimum_requirements:
  - action_identified
  - actor_attributable
  - intent_traceable
  - process_traceable
failure_contract:
  failure_states:
  - action_unattributed
  - intent_missing
  - action_assumed_to_be_state_change
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
