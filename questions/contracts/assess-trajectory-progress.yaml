id: core.question.assess-trajectory-progress
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Is the system still moving toward DesiredState?
classification:
  primary_family: core.question-family.reflective
  families:
  - core.question-family.reflective
  - core.question-family.teleological
requires:
  concepts:
  - core.progress
  - core.trajectory
  - core.desired-state
  - core.state-change
  - core.direction
  relations:
  - core.rel.evaluates
  - core.rel.evaluated-against
  - core.rel.comprises-state-change
must_preserve:
  boundaries:
  - core.boundary.operational-success-not-goal-progress
answer_contract:
  minimum_requirements:
  - trajectory_identified
  - desired_state_or_direction_identified
  - progress_evaluated_independently_of_operational_success
failure_contract:
  failure_states:
  - progress_inferred_from_execution_success
  - desired_state_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
