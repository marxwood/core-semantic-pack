id: core.question.identify-later-contradiction-or-supersession
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What later contradicted or superseded it?
classification:
  primary_family: core.question-family.memory
  families:
  - core.question-family.memory
  - core.question-family.reflective
  - core.question-family.epistemic
requires:
  concepts:
  - core.contradiction
  - core.contestation
  - core.semantic-version
  - core.provenance
  relations:
  - core.rel.contradicts
  - core.rel.contested-by
  - core.rel.supersedes
  - core.rel.has-provenance
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - later_contradiction_or_supersession_visible
  - lineage_preserved
failure_contract:
  failure_states:
  - contradiction_suppressed
  - supersession_history_erased
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
