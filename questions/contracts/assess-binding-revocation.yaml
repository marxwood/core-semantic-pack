id: core.question.assess-binding-revocation
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Should a previous Binding be revoked?
classification:
  primary_family: core.question-family.reflective
  families:
  - core.question-family.reflective
  - core.question-family.governance
requires:
  concepts:
  - core.binding
  - core.commitment
  - core.revocation
  - core.authority
  - core.context
  - core.provenance
  relations:
  - core.rel.establishes-commitment
  - core.rel.revokes-object
  - core.rel.authorized-by
  - core.rel.exists-in
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.review-not-binding
  - core.boundary.finding-not-binding-decision
answer_contract:
  minimum_requirements:
  - binding_identified
  - commitment_identified
  - revocation_basis_traceable
  - revocation_authority_traceable
  - context_explicit
failure_contract:
  failure_states:
  - binding_history_missing
  - revocation_authority_missing
  - review_used_as_revocation
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
