id: core.question.detect-goal-change
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Has the Goal changed?
classification:
  primary_family: core.question-family.teleological
  families:
  - core.question-family.teleological
  - core.question-family.reflective
  - core.question-family.governance
  - core.question-family.memory
requires:
  concepts:
  - core.goal
  - core.semantic-version
  - core.context
  - core.provenance
  - core.authority
  relations:
  - core.rel.supersedes
  - core.rel.versioned-by
  - core.rel.has-provenance
  - core.rel.authorized-by
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - current_goal_identified
  - previous_goal_or_no_previous_goal_explicit
  - version_lineage_traceable
  - change_authority_traceable
  - context_explicit
failure_contract:
  failure_states:
  - goal_drift_untracked
  - goal_version_lineage_missing
  - unauthorized_goal_change
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
