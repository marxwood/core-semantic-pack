id: core.question.identify-representation
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which representation are we looking at?
classification:
  primary_family: core.question-family.interpretive
  families:
  - core.question-family.interpretive
requires:
  concepts:
  - core.projection
  - core.derivative
  - core.source
  - core.state
  - core.context
  relations:
  - core.rel.projects
  - core.rel.derived-from
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.source-not-projection
  - core.boundary.projection-not-state
answer_contract:
  minimum_requirements:
  - representation_type_identified
  - represented_object_traceable
  - representation_context_explicit
failure_contract:
  failure_states:
  - representation_type_unknown
  - projection_treated_as_source_or_state
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
