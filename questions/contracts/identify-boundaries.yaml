id: core.question.identify-boundaries
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Where are its boundaries?
classification:
  primary_family: core.question-family.ontological
  families:
  - core.question-family.ontological
requires:
  concepts:
  - core.entity
  - core.boundary
  - core.context
  relations:
  - core.rel.bounded-by
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - boundary_or_scope_identified
  - boundary_context_explicit
failure_contract:
  failure_states:
  - boundary_implicit
  - scope_ambiguous
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
