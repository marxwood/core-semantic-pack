id: core.question.identify-applicable-constraint
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Under which Constraint?
classification:
  primary_family: core.question-family.governance
  families:
  - core.question-family.governance
requires:
  concepts:
  - core.constraint
  - core.context
  relations:
  - core.rel.constrained-by
  - core.rel.applies-to
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - constraint_identified
  - constrained_object_or_transition_identified
  - constraint_context_explicit
failure_contract:
  failure_states:
  - constraint_implicit
  - constraint_scope_ambiguous
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
