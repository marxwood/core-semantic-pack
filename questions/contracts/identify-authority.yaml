id: core.question.identify-authority
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Who authorized this?
classification:
  primary_family: core.question-family.governance
  families:
  - core.question-family.governance
requires:
  concepts:
  - core.authority
  - core.actor
  - core.role
  - core.context
  relations:
  - core.rel.authorized-by
  - core.rel.held-by
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.capability-not-authority
  - core.boundary.intent-not-authority
answer_contract:
  minimum_requirements:
  - authority_identified
  - authority_holder_or_source_traceable
  - authority_scope_context_explicit
failure_contract:
  failure_states:
  - implicit_authority
  - authority_scope_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
