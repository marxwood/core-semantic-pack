id: core.question.identify-admission-status
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Under which semantic status was it admitted?
classification:
  primary_family: core.question-family.memory
  families:
  - core.question-family.memory
  - core.question-family.governance
requires:
  concepts:
  - core.admission
  - core.validity
  - core.state
  - core.authority
  relations:
  - core.rel.admitted-by
  - core.rel.has-validity
  - core.rel.authorized-by
must_preserve:
  boundaries:
  - core.boundary.validation-not-admission
  - core.boundary.persistence-not-admission
answer_contract:
  minimum_requirements:
  - admission_act_or_nonadmission_explicit
  - validity_status_preserved
  - admission_authority_traceable_if_admitted
failure_contract:
  failure_states:
  - admission_status_lost
  - validation_or_persistence_used_as_admission
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
