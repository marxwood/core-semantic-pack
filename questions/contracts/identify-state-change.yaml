id: core.question.identify-state-change
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What changed?
classification:
  primary_family: core.question-family.state
  families:
  - core.question-family.state
  - core.question-family.reflective
requires:
  concepts:
  - core.state-change
  - core.state
  - core.provenance
  relations:
  - core.rel.previous-state
  - core.rel.resulting-state
  - core.rel.caused-by
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.action-not-state-change
answer_contract:
  minimum_requirements:
  - change_identified
  - before_and_after_states_identified
  - cause_or_cause_status_explicit
  - provenance_traceable
failure_contract:
  failure_states:
  - missing_before_state
  - missing_after_state
  - action_assumed_to_be_change
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
