id: core.question.assess-state-change-progress
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Is the resulting StateChange advancing the DesiredState?
classification:
  primary_family: core.question-family.teleological
  families:
  - core.question-family.teleological
  - core.question-family.reflective
requires:
  concepts:
  - core.state-change
  - core.desired-state
  - core.progress
  - core.state
  - core.trajectory
  relations:
  - core.rel.evaluates
  - core.rel.evaluated-against
  - core.rel.comprises-state-change
must_preserve:
  boundaries:
  - core.boundary.action-not-state-change
  - core.boundary.operational-success-not-goal-progress
answer_contract:
  minimum_requirements:
  - state_change_identified
  - desired_state_identified
  - progress_evaluation_explicit
  - operational_success_separated_from_progress
failure_contract:
  failure_states:
  - state_change_missing
  - progress_inferred_from_execution_success
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
