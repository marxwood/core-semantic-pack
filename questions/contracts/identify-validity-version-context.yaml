id: core.question.identify-validity-version-context
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Under which version and Context was it valid?
classification:
  primary_family: core.question-family.memory
  families:
  - core.question-family.memory
requires:
  concepts:
  - core.semantic-version
  - core.validity
  - core.context
  - core.provenance
  relations:
  - core.rel.versioned-by
  - core.rel.has-validity
  - core.rel.exists-in
  - core.rel.has-provenance
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - semantic_version_identified
  - validity_status_identified
  - validity_context_explicit
  - historical_provenance_traceable
failure_contract:
  failure_states:
  - historical_meaning_unreconstructable
  - version_or_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
