id: core.question.identify-current-state
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What is currently the case?
classification:
  primary_family: core.question-family.state
  families:
  - core.question-family.state
  - core.question-family.reflective
requires:
  concepts:
  - core.entity
  - core.state
  - core.context
  relations:
  - core.rel.has-state
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.projection-not-state
answer_contract:
  minimum_requirements:
  - current_state_identified
  - state_bound_to_entity
  - state_context_known
failure_contract:
  failure_states:
  - projection_substituted_for_state
  - state_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
