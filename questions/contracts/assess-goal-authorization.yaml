id: core.question.assess-goal-authorization
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Is the Goal still authorized?
classification:
  primary_family: core.question-family.reflective
  families:
  - core.question-family.reflective
  - core.question-family.governance
  - core.question-family.teleological
requires:
  concepts:
  - core.goal
  - core.authority
  - core.context
  - core.revocation
  relations:
  - core.rel.authorized-by
  - core.rel.revoked-by
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.capability-not-authority
  - core.boundary.intent-not-authority
answer_contract:
  minimum_requirements:
  - goal_identified
  - active_authority_traceable
  - revocation_status_checked
  - context_explicit
failure_contract:
  failure_states:
  - stale_or_revoked_authority_assumed
  - authority_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
