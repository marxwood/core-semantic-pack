id: core.question.identify-validation-requirement
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What must be validated?
classification:
  primary_family: core.question-family.governance
  families:
  - core.question-family.governance
requires:
  concepts:
  - core.validation
  - core.contract
  - core.constraint
  relations:
  - core.rel.validates-object
  - core.rel.governed-by
  - core.rel.constrained-by
must_preserve:
  boundaries:
  - core.boundary.validation-not-admission
answer_contract:
  minimum_requirements:
  - validation_subject_identified
  - validation_obligation_traceable
  - validation_distinguished_from_admission
failure_contract:
  failure_states:
  - validation_subject_missing
  - validation_used_as_admission
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
