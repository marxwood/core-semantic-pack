id: core.question.identify-uncertainty
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: How uncertain is it?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
requires:
  concepts:
  - core.uncertainty
  - core.context
  relations:
  - core.rel.has-uncertainty
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - uncertainty_status_explicit
  - uncertainty_context_explicit
failure_contract:
  failure_states:
  - uncertainty_omitted
  - uncertainty_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
