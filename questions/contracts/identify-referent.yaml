id: core.question.identify-referent
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What is this?
classification:
  primary_family: core.question-family.ontological
  families:
  - core.question-family.ontological
requires:
  concepts:
  - core.entity
  - core.identity
  - core.context
  relations:
  - core.rel.has-identity
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - referent_identified
  - identity_or_identity_status_declared
  - context_explicit
failure_contract:
  failure_states:
  - unresolved_referent
  - implicit_context
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
