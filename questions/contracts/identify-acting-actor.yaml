id: core.question.identify-acting-actor
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Who or what is acting?
classification:
  primary_family: core.question-family.agency
  families:
  - core.question-family.agency
requires:
  concepts:
  - core.actor
  - core.action
  - core.role
  - core.provenance
  relations:
  - core.rel.performed-by
  - core.rel.occupies-role
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.capability-not-authority
answer_contract:
  minimum_requirements:
  - action_identified
  - actor_or_role_attributable
  - provenance_preserved
failure_contract:
  failure_states:
  - anonymous_material_action
  - actor_role_ambiguous
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
