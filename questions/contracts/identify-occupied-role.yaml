id: core.question.identify-occupied-role
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which Role is being occupied?
classification:
  primary_family: core.question-family.agency
  families:
  - core.question-family.agency
requires:
  concepts:
  - core.actor
  - core.role
  - core.context
  relations:
  - core.rel.occupies-role
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - actor_identified
  - role_identified
  - role_context_explicit
failure_contract:
  failure_states:
  - role_ambiguous
  - role_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
