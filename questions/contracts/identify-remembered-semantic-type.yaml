id: core.question.identify-remembered-semantic-type
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Was it an Observation, Claim, Evidence item, Inference, Finding, Decision, Goal, or StateChange?
classification:
  primary_family: core.question-family.memory
  families:
  - core.question-family.memory
requires:
  concepts:
  - core.observation
  - core.claim
  - core.evidence
  - core.inference
  - core.finding
  - core.binding
  - core.commitment
  - core.goal
  - core.state-change
  - core.semantic-version
  relations:
  - core.rel.versioned-by
must_preserve:
  boundaries:
  - core.boundary.observation-not-claim
  - core.boundary.claim-not-evidence
  - core.boundary.inference-not-finding
  - core.boundary.finding-not-binding-decision
  - core.boundary.action-not-state-change
answer_contract:
  minimum_requirements:
  - semantic_type_identified
  - type_status_not_collapsed
  - semantic_version_known
failure_contract:
  failure_states:
  - semantic_type_lost
  - epistemic_or_governance_type_collapsed
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
