id: core.question.identify-statement
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What is being stated?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
requires:
  concepts:
  - core.statement
  - core.actor
  - core.source
  - core.context
  relations:
  - core.rel.expressed-by
  - core.rel.exists-in
must_preserve:
  boundaries: []
answer_contract:
  minimum_requirements:
  - statement_identified
  - expression_source_or_actor_identified
  - context_explicit
failure_contract:
  failure_states:
  - statement_unattributed
  - statement_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
