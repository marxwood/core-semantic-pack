id: core.question.identify-remembered-object
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What exactly is being remembered?
classification:
  primary_family: core.question-family.memory
  families:
  - core.question-family.memory
requires:
  concepts:
  - core.persistence
  - core.provenance
  - core.semantic-version
  relations:
  - core.rel.persists-object
  - core.rel.has-provenance
  - core.rel.versioned-by
must_preserve:
  boundaries:
  - core.boundary.persistence-not-admission
answer_contract:
  minimum_requirements:
  - persisted_object_identified
  - semantic_type_preserved
  - provenance_preserved
  - version_preserved
failure_contract:
  failure_states:
  - stored_content_without_semantic_identity
  - provenance_detached
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
