id: core.question.identify-resulting-state
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What exists now?
classification:
  primary_family: core.question-family.state
  families:
  - core.question-family.state
requires:
  concepts:
  - core.state-change
  - core.state
  - core.provenance
  relations:
  - core.rel.resulting-state
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.projection-not-state
  - core.boundary.action-not-state-change
answer_contract:
  minimum_requirements:
  - state_change_identified
  - resulting_state_identified
  - change_provenance_traceable
failure_contract:
  failure_states:
  - resulting_state_missing
  - projection_used_as_resulting_state
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
