id: core.question.identify-permission
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What is permitted?
classification:
  primary_family: core.question-family.governance
  families:
  - core.question-family.governance
requires:
  concepts:
  - core.permission
  - core.authority
  - core.actor
  - core.role
  - core.action
  - core.context
  relations:
  - core.rel.permits
  - core.rel.authorized-by
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.capability-not-authority
answer_contract:
  minimum_requirements:
  - permission_identified
  - permitted_object_or_actor_identified
  - permission_authority_traceable
  - permission_scope_explicit
failure_contract:
  failure_states:
  - permission_implicit
  - capability_used_as_permission
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
