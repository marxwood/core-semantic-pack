id: core.question.identify-observation
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What was observed?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
requires:
  concepts:
  - core.source
  - core.observation
  - core.provenance
  - core.actor
  relations:
  - core.rel.observed-from
  - core.rel.observed-by
  - core.rel.has-provenance
must_preserve:
  boundaries:
  - core.boundary.observation-not-claim
answer_contract:
  minimum_requirements:
  - observation_identified
  - source_traceable
  - observer_or_observer_status_known
  - provenance_preserved
failure_contract:
  failure_states:
  - observation_promoted_to_claim
  - source_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
