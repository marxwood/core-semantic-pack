id: core.question.detect-material-current-state-change
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Has CurrentState changed materially?
classification:
  primary_family: core.question-family.reflective
  families:
  - core.question-family.reflective
  - core.question-family.state
requires:
  concepts:
  - core.state
  - core.state-change
  - core.context
  - core.provenance
  relations:
  - core.rel.previous-state
  - core.rel.resulting-state
  - core.rel.has-provenance
  - core.rel.exists-in
must_preserve:
  boundaries:
  - core.boundary.action-not-state-change
  - core.boundary.projection-not-state
answer_contract:
  minimum_requirements:
  - before_and_after_states_comparable
  - material_change_identified_or_ruled_out
  - provenance_traceable
failure_contract:
  failure_states:
  - execution_assumed_to_be_change
  - projection_used_as_current_state
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
