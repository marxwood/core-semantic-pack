id: core.question.identify-supporting-evidence
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What supports the Claim?
classification:
  primary_family: core.question-family.epistemic
  families:
  - core.question-family.epistemic
  - core.question-family.governance
requires:
  concepts:
  - core.claim
  - core.evidence
  - core.provenance
  - core.admission
  relations:
  - core.rel.supports
  - core.rel.has-provenance
  - core.rel.admitted-by
must_preserve:
  boundaries:
  - core.boundary.claim-not-evidence
  - core.boundary.evidence-not-truth
answer_contract:
  minimum_requirements:
  - claim_identified
  - supporting_evidence_identified
  - evidence_provenance_traceable
  - evidence_admission_status_explicit
failure_contract:
  failure_states:
  - claim_used_as_own_evidence
  - evidence_provenance_missing
  - evidence_unadmitted_or_status_unknown
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
composition:
  independently_resolvable: true
  requirements_inherited_from_family: false
