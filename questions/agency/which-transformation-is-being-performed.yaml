id: core.question.identify-performed-transformation
version: 0.1.0
status: experimental
kind: semantic-question-contract

canonical_question: Which Transformation is being performed?

family: agency

requires:
  concepts:
    - Process
    - Transformation
    - Action
    - State

  relations:
    - comprisesTransformation
    - transforms
    - partOfProcess

must_preserve:
  - Action != StateChange
  - Process != ExecutionContract

answer_contract:
  minimum_requirements:
    - transformation_identified
    - process_membership_traceable
    - transformed_object_or_state_identified

failure_contract:
  failure_states:
    - transformation_missing
    - process_execution_collapsed

  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
