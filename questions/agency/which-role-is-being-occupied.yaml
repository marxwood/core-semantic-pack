id: core.question.identify-occupied-role
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Which Role is being occupied?
family: agency

requires:
  concepts:
    - Actor
    - Role
    - Context

  relations:
    - occupiesRole
    - existsIn

must_preserve: []

answer_contract:
  minimum_requirements:
    - actor_identified
    - role_identified
    - role_context_explicit

failure_contract:
  failure_states:
    - role_ambiguous
    - role_context_missing

  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
