id: core.question-family.state
version: 0.1.0
status: experimental
family: state
canonical_questions:
- What is currently the case?
- What State is maintained?
- What existed before?
- What exists now?
- What changed?
- What State is expected next?
requires_concepts:
- core.entity
- core.state
- core.state-change
- core.context
- core.provenance
requires_relations:
- core.rel.state-of
- core.rel.previous-state
- core.rel.resulting-state
- core.rel.caused-by
- core.rel.has-provenance
must_preserve:
- core.boundary.projection-not-state
- core.boundary.action-not-state-change
- core.boundary.persistence-not-admission
answer_requirements:
- entity_identified
- current_state_identified
- state_context_known
- change_has_before_and_after
- change_attributable
failure_states:
- projection_substituted_for_state
- missing_previous_state
- unattributed_change
consequence_on_failure:
  state_update: forbidden
  external_effect: requires_escalation
