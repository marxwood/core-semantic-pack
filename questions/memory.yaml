id: core.question-family.memory
version: 0.1.0
status: experimental
family: memory
canonical_questions:
- What should the system remember?
- What exactly is being remembered?
- Which semantic type and status did it have?
- Under which Admission was it stored?
- Which Provenance does it retain?
- What later contradicted or superseded it?
- Is it still valid?
requires_concepts:
- core.persistence
- core.state
- core.admission
- core.provenance
- core.semantic-version
- core.validity
- core.contestation
- core.state-change
requires_relations:
- core.rel.persists-object
- core.rel.admitted-by
- core.rel.has-provenance
- core.rel.versioned-by
- core.rel.has-validity
- core.rel.contested-by
- core.rel.supersedes
must_preserve:
- core.boundary.persistence-not-admission
- core.boundary.repetition-not-validation
- core.boundary.projection-not-state
- core.boundary.inference-not-finding
answer_requirements:
- stored_object_type_preserved
- admission_status_preserved
- provenance_preserved
- version_preserved
- supersession_and_contestation_visible
failure_states:
- stored_text_without_type
- persistence_promoted_status
- provenance_detached
- historical_meaning_unreconstructable
consequence_on_failure:
  reuse: provisional_only
  maintained_state: forbidden
