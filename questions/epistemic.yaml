id: core.question-family.epistemic
version: 0.1.0
status: experimental
family: epistemic
canonical_questions:
- What was observed?
- What is being claimed?
- What supports or contradicts the Claim?
- What was inferred?
- What Finding was derived?
- How uncertain is it?
- Under which Context is it valid?
requires_concepts:
- core.source
- core.observation
- core.claim
- core.evidence
- core.inference
- core.finding
- core.provenance
- core.uncertainty
- core.validity
- core.contestation
requires_relations:
- core.rel.observed-from
- core.rel.asserted-by
- core.rel.supports
- core.rel.contradicts
- core.rel.inferred-from
- core.rel.has-provenance
- core.rel.has-uncertainty
- core.rel.has-validity
must_preserve:
- core.boundary.observation-not-claim
- core.boundary.claim-not-evidence
- core.boundary.evidence-not-truth
- core.boundary.inference-not-finding
answer_requirements:
- source_traceable
- claim_status_explicit
- evidence_admission_traceable
- inference_lineage_preserved
- validity_context_known
failure_states:
- unsupported_claim
- claim_used_as_evidence
- inference_promoted_without_evaluation
- provenance_missing
consequence_on_failure:
  finding_status: candidate_only
  admission: forbidden
