id: core.migration.question-contracts.atomic-v0.1
version: 0.1.0
status: experimental
classification: breaking-serialization-and-resolution-change
from_model: family-level requirement bundles
to_model: one canonical question per independently resolvable Semantic Question Contract
reason: Family-level bundles over-constrained question-driven resolution and made taxonomy act as semantic authority.
changes:
- move question requirements from family records into atomic contracts
- make family records taxonomy-only
- allow explicit multi-family classification without duplicating contracts
- resolve requested questions independently before composition
- remove legacy questions/<family>.yaml requirement bundles
compatibility:
  legacy_family_ids_remain: true
  legacy_family_semantic_requirements_remain: false
  automatic_requirement_inheritance_from_family: false
