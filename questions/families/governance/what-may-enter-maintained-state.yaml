id: core.question.identify-admissible-maintained-state
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What may enter maintained State?
family: governance
requires:
  concepts:
  - Admission
  - State
  - Authority
  - Validation
  - Persistence
  relations:
  - admitsObject
  - producesState
  - authorizedBy
must_preserve:
- Validation != Admission
- Persistence != Admission
- Projection != State
answer_contract:
  minimum_requirements:
  - candidate_identified
  - admission_requirement_explicit
  - admission_authority_traceable
  - resulting_state_traceable
failure_contract:
  failure_states:
  - candidate_persisted_without_admission
  - validation_used_as_admission
  - projection_promoted_to_state
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
