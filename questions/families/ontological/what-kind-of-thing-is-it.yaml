id: core.question.classify-semantic-kind
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What kind of thing is it?
family: ontological
requires:
  concepts:
  - Entity
  - Context
  relations:
  - existsIn
must_preserve: []
answer_contract:
  minimum_requirements:
  - semantic_kind_declared
  - classification_context_explicit
failure_contract:
  failure_states:
  - unclassified_referent
  - classification_context_missing
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
