id: core.question.identify-referent
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: What is this?
family: ontological
requires:
  concepts:
  - Entity
  - Identity
  - Context
  relations:
  - hasIdentity
  - existsIn
must_preserve: []
answer_contract:
  minimum_requirements:
  - referent_identified
  - identity_or_identity_status_declared
  - context_explicit
failure_contract:
  failure_states:
  - unresolved_referent
  - implicit_context
  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
