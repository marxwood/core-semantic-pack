id: core.question.detect-projection-admitted-as-state
version: 0.1.0
status: experimental
kind: semantic-question-contract
canonical_question: Has a Projection silently become accepted as State?
family: interpretive

requires:
  concepts:
    - Projection
    - State
    - Admission
    - Persistence
    - Provenance

  relations:
    - projects
    - admittedBy
    - persistsObject
    - hasProvenance

must_preserve:
  - Projection != State
  - Persistence != Admission

answer_contract:
  minimum_requirements:
    - projection_identified
    - state_identified
    - admission_transition_traceable_if_present
    - persistence_distinguished_from_admission

failure_contract:
  failure_states:
    - projection_collapse
    - persistence_used_as_admission

  consequence_on_failure:
    answer_status: unresolved
    material_consequence: must-not-assume-answer
