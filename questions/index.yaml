id: core.question-index
version: 0.1.0
status: experimental

question_model:
  atomic_contract: true
  one_canonical_question_per_contract: true
  one_primary_family_per_question: true
  family_authority: taxonomy-only
  independently_resolvable: true
  family_requirements_inherited: false
  canonical_question_resolution: exact
  related_questions_expand_automatically: false

families:
  - symbol: ontological
    id: core.question-family.ontological
    file: questions/families/ontological/family.yaml
    question_count: 6
    related_question_count: 0

  - symbol: state
    id: core.question-family.state
    file: questions/families/state/family.yaml
    question_count: 6
    related_question_count: 0

  - symbol: epistemic
    id: core.question-family.epistemic
    file: questions/families/epistemic/family.yaml
    question_count: 9
    related_question_count: 0

  - symbol: interpretive
    id: core.question-family.interpretive
    file: questions/families/interpretive/family.yaml
    question_count: 5
    related_question_count: 0

  - symbol: teleological
    id: core.question-family.teleological
    file: questions/families/teleological/family.yaml
    question_count: 7
    related_question_count: 0

  - symbol: agency
    id: core.question-family.agency
    file: questions/families/agency/family.yaml
    question_count: 6
    related_question_count: 0

  - symbol: governance
    id: core.question-family.governance
