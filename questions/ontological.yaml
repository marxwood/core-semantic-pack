id: core.question-family.ontological
version: 0.1.0
status: experimental
family: ontological
canonical_questions:
- What is this?
- What kind of thing is it?
- Which identity does it have?
- Where are its boundaries?
- In which Context does this meaning apply?
requires_concepts:
- core.entity
- core.identity
- core.relation
- core.context
- core.boundary
requires_relations:
- core.rel.has-identity
- core.rel.exists-in
- core.rel.bounded-by
must_preserve: []
answer_requirements:
- referent_identified
- identity_declared
- context_declared
- boundary_or_scope_known
failure_states:
- unresolved_identity
- implicit_context
- ambiguous_boundary
consequence_on_failure:
  interpretation: provisional
  binding: forbidden
