id: core.question-family.interpretive
version: 0.1.0
status: experimental
family: interpretive
canonical_questions:
- Which interpretation of reality produced this conclusion?
- Which representation are we looking at?
- Which Source or State does it derive from?
- Which Context shaped the interpretation?
- Has a Projection silently become accepted as State?
requires_concepts:
- core.interpretation
- core.projection
- core.source
- core.state
- core.derivative
- core.context
- core.provenance
requires_relations:
- core.rel.interprets
- core.rel.projects
- core.rel.derived-from
- core.rel.exists-in
- core.rel.has-provenance
must_preserve:
- core.boundary.source-not-projection
- core.boundary.projection-not-state
answer_requirements:
- representation_type_known
- source_or_state_traceable
- interpretive_context_explicit
- projection_non_authority_explicit
failure_states:
- projection_collapse
- source_detached
- implicit_interpretation
consequence_on_failure:
  state_use: forbidden
  downstream_transfer: must_preserve_provisional_status
