id: core.concept-group.teleological
version: 0.1.0
status: experimental
layer: teleological
concepts:
- id: core.goal
  symbol: Goal
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An authorized objective that gives direction to interpretation, planning, and action within
    a declared scope.
  not_equivalent_to:
  - DesiredState
  - Intent
  - Action
  exclusions:
  - Goal is not a metric alone.
  required_relations:
  - specifies
  - authorizedBy
  conditional_relations:
  - existsIn
  - impliesDirection
  - versionedBy
  - supersedes
  boundaries:
  - Goal != DesiredState
  - Intent != Goal
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Autonomous action requires explicit normative direction rather than hidden objectives embedded
      in prompts or implementation.
  layer: teleological
- id: core.desired-state
  symbol: DesiredState
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit representation of a future State whose realization or approximation would indicate
    advancement of a Goal.
  not_equivalent_to:
  - Prediction
  - Plan
  - Goal
  exclusions:
  - DesiredState is not CurrentState.
  required_relations:
  - desiredBy
  conditional_relations:
  - existsIn
  - hasValidity
  - versionedBy
  - supersedes
  boundaries:
  - Goal != DesiredState
  - DesiredState != Prediction
  - DesiredState != Plan
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Goals need inspectable future-state representations so trajectory can be assessed independently
      from action completion.
  layer: teleological
- id: core.intent
  symbol: Intent
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual aim that translates a Goal into the immediate purpose of an Action or Process
    participation.
  not_equivalent_to:
  - Goal
  - Authority
  - Action
  - Permission
  required_relations:
  - advances
  conditional_relations:
  - heldBy
  - existsIn
  - constrainedBy
  - versionedBy
  boundaries:
  - Intent != Goal
  - Intent != Authority
  - Action != Intent
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The immediate purpose of action must remain traceable to the larger Goal without becoming
      the Goal or its own authority.
  layer: teleological
- id: core.direction
  symbol: Direction
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The qualitative orientation of change implied by the relationship between CurrentState and
    DesiredState under a Goal.
  not_equivalent_to:
  - Trajectory
  - Plan
  - Goal
  exclusions:
  - Direction is not a single Action.
  required_relations:
  - fromState
  - towardState
  conditional_relations:
  - impliedBy
  - existsIn
  - versionedBy
  boundaries:
  - OperationalSuccess != Progress
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Direction allows qualitative alignment to be assessed even when no complete plan or deterministic
      path exists.
  layer: teleological
- id: core.trajectory
  symbol: Trajectory
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An observed or proposed sequence of StateChanges over time that can be evaluated against
    a Direction or DesiredState.
  not_equivalent_to:
  - Goal
  - Direction
  - ExecutionPlan
  exclusions:
  - Trajectory is not proof of progress.
  required_relations:
  - comprisesStateChange
  conditional_relations:
  - evaluatedAgainst
  - existsIn
  - versionedBy
  boundaries:
  - OperationalSuccess != Progress
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Autonomous systems need longitudinal assessment rather than isolated success signals.
  layer: teleological
- id: core.progress
  symbol: Progress
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual assessment of how CurrentState or Trajectory relates to a DesiredState under
    declared criteria.
  not_equivalent_to:
  - Goal
  - Direction
  exclusions:
  - Progress is not operational success.
  - Progress is not activity volume.
  required_relations:
  - evaluates
  - evaluatedAgainst
  conditional_relations:
  - hasProvenance
  - hasUncertainty
  - hasValidity
  - existsIn
  boundaries:
  - OperationalSuccess != Progress
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: A successful action does not establish that the system moved toward the intended state.
  layer: teleological
