id: core.contestation
version: 0.1.0
status: experimental
kind: candidate-core-primitive
layer: epistemic

symbol: Contestation

definition: >-
  An explicit governed challenge to the meaning, support, validity, admission, authority, or maintained
  status of a semantic object or relation.

exclusions:
  - Contestation is not automatic invalidation.
  - Contestation is not deletion.
  - Contestation is not mere disagreement without a referable object.

required_relations:
  - contests
  - raisedBy

conditional_relations:
  - existsIn
  - hasProvenance
  - reviewedBy
  - resolvedBy

boundaries: []

derivation:
  source: CORE-SEMANTIC-PACK.md
  status: working-reference

  rationale: >-
    Disagreement must remain visible, attributable, and reviewable to preserve correction capability.
