id: core.concept-group.epistemic
version: 0.1.0
status: experimental
layer: epistemic
concepts:
- id: core.observation
  name: Observation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A recorded result of perceiving, measuring, retrieving, or otherwise encountering a Source
    under a declared Context.
  answers:
  - What was observed?
  - From which Source and under which Context?
  what_it_is_not:
  - a Claim
  - Evidence by default
  - an Interpretation beyond what was recorded
  required_relations:
  - core.rel.observed-from
  - core.rel.exists-in
  - core.rel.has-provenance
  conditional_relations:
  - core.rel.observed-by
  - core.rel.has-uncertainty
  - core.rel.versioned-by
  boundaries:
  - core.boundary.observation-not-claim
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Perception must remain distinct from what the system later asserts about what was perceived.
  layer: epistemic
- id: core.statement
  name: Statement
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A semantically typed expression that can be attributed, interpreted, questioned, or asserted
    without implying that it has already been accepted as true.
  answers:
  - What was expressed?
  - Who or what expressed it and in which Context?
  what_it_is_not:
  - truth
  - Evidence
  - a Claim unless asserted as such
  required_relations: []
  conditional_relations:
  - core.rel.expressed-by
  - core.rel.exists-in
  - core.rel.has-provenance
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The system needs a neutral expression layer before assertion status is attached.
  layer: epistemic
- id: core.claim
  name: Claim
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A Statement asserted as being possibly true or false about an Entity, State, Relation, or
    condition under a declared Context.
  answers:
  - What is being asserted?
  - Who asserted it?
  - What supports or contradicts it?
  what_it_is_not:
  - truth
  - Evidence
  - a Finding
  - maintained State by default
  required_relations:
  - core.rel.asserted-by
  - core.rel.exists-in
  conditional_relations:
  - core.rel.supported-by
  - core.rel.contradicted-by
  - core.rel.has-provenance
  - core.rel.has-uncertainty
  - core.rel.has-validity
  - core.rel.contested-by
  boundaries:
  - core.boundary.claim-not-evidence
  - core.boundary.evidence-not-truth
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Assertions must retain their epistemic status rather than becoming true through fluency,
      repetition, or persistence.
  layer: epistemic
- id: core.evidence
  name: Evidence
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable object admitted under a declared Regime as support for, or contradiction of,
    a Claim.
  answers:
  - What supports or contradicts this Claim?
  - Under which Regime was the object admitted as Evidence?
  what_it_is_not:
  - a raw Source
  - a raw tool result
  - a Claim
  - proof of universal truth
  required_relations:
  - core.rel.has-provenance
  - core.rel.exists-in
  - core.rel.admitted-by
  conditional_relations:
  - core.rel.supports
  - core.rel.contradicts
  - core.rel.has-validity
  - core.rel.has-uncertainty
  - core.rel.contested-by
  boundaries:
  - core.boundary.claim-not-evidence
  - core.boundary.evidence-not-truth
  - core.boundary.validation-not-admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Evidence is a governed epistemic status, not an intrinsic property of any retrieved or
      generated object.
  layer: epistemic
- id: core.inference
  name: Inference
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A Derivative conclusion produced by reasoning from one or more Observations, Claims, Evidence
    objects, Findings, or prior Inferences.
  answers:
  - What was inferred?
  - From which premises or Evidence?
  - Which reasoning transformation produced it?
  what_it_is_not:
  - a Finding by default
  - maintained State
  - Evidence
  - Binding
  required_relations:
  - core.rel.inferred-from
  - core.rel.has-provenance
  conditional_relations:
  - core.rel.produced-by
  - core.rel.has-uncertainty
  - core.rel.has-validity
  - core.rel.contested-by
  boundaries:
  - core.boundary.inference-not-finding
  - core.boundary.persistence-not-admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Intermediate reasoning must retain provisional status and cannot become institutional truth
      merely by being stored or reused.
  layer: epistemic
- id: core.finding
  name: Finding
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual epistemic result produced by evaluating Evidence and Inference under declared
    validity and review conditions.
  answers:
  - What conclusion has the governed evaluation produced?
  - Which Evidence and Inferences contributed?
  - What is its validity status?
  what_it_is_not:
  - universal truth
  - BindingDecision
  - maintained State by default
  - a polished Projection
  required_relations:
  - core.rel.derived-from
  - core.rel.has-provenance
  - core.rel.has-validity
  conditional_relations:
  - core.rel.supported-by
  - core.rel.contradicted-by
  - core.rel.has-uncertainty
  - core.rel.contested-by
  - core.rel.admitted-by
  boundaries:
  - core.boundary.inference-not-finding
  - core.boundary.finding-not-binding-decision
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: A governed result must remain distinguishable from intermediate reasoning and from authority-bearing
      decisions.
  layer: epistemic
- id: core.provenance
  name: Provenance
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The reconstructable lineage of origin, attribution, transformation, context, and version
    for a semantic object or relation.
  answers:
  - Where did this come from?
  - Who or what produced it?
  - Which transformations and versions affected it?
  what_it_is_not:
  - a citation alone
  - a source identifier alone
  - proof of validity
  required_relations: []
  conditional_relations:
  - core.rel.derived-from
  - core.rel.produced-by
  - core.rel.versioned-by
  - core.rel.exists-in
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic continuity requires lineage to survive transfer, composition, persistence, and
      projection.
  layer: epistemic
- id: core.support
  name: Support
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable contextual assertion that an allowed semantic object increases warranted acceptance
    of a Claim under declared conditions.
  answers:
  - How and under which Context does this object support the Claim?
  - Who or what established the support relation?
  what_it_is_not:
  - proof
  - truth
  - the Evidence object itself
  - an unqualified graph edge
  required_relations:
  - core.rel.support-subject
  - core.rel.support-object
  - core.rel.exists-in
  conditional_relations:
  - core.rel.has-provenance
  - core.rel.has-validity
  - core.rel.has-uncertainty
  boundaries:
  - core.boundary.evidence-not-truth
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Support may need to be inspected, contested, versioned, or qualified independently from
      the objects it connects.
  layer: epistemic
- id: core.contradiction
  name: Contradiction
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable contextual assertion that two semantic objects or positions conflict under declared
    comparison conditions.
  answers:
  - What conflicts with what?
  - Under which Context and comparison rule does the conflict exist?
  what_it_is_not:
  - automatic invalidation
  - proof that one side is false
  - mere difference
  required_relations:
  - core.rel.contradiction-subject
  - core.rel.contradiction-object
  - core.rel.exists-in
  conditional_relations:
  - core.rel.has-provenance
  - core.rel.has-validity
  - core.rel.contested-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Contradiction must remain visible and governable rather than being silently resolved or
      discarded.
  layer: epistemic
- id: core.uncertainty
  name: Uncertainty
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit representation of limits, confidence, ambiguity, unknowns, or incompleteness
    associated with a semantic object or relation.
  answers:
  - What remains unknown or uncertain?
  - Which limit applies to this interpretation or conclusion?
  what_it_is_not:
  - an error
  - invalidity by itself
  - a single probability by definition
  required_relations: []
  conditional_relations:
  - core.rel.exists-in
  - core.rel.has-provenance
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Correction-capable reasoning requires uncertainty to remain explicit across representations
      and downstream use.
  layer: epistemic
- id: core.validity
  name: Validity
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The declared status of conformance, applicability, or acceptability of an object or relation
    under a specific Context, Regime, time, and SemanticVersion.
  answers:
  - Under which conditions is this considered valid?
  - Which validation or regime established the status?
  what_it_is_not:
  - universal truth
  - Admission
  - Binding
  - runtime success
  required_relations:
  - core.rel.exists-in
  conditional_relations:
  - core.rel.established-by
  - core.rel.versioned-by
  - core.rel.supersedes
  boundaries:
  - core.boundary.validation-not-admission
  - core.boundary.evidence-not-truth
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Validity is contextual and versioned; it must not silently become universal truth or institutional
      authority.
  layer: epistemic
- id: core.contestation
  name: Contestation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit governed challenge to the meaning, support, validity, admission, authority,
    or maintained status of a semantic object or relation.
  answers:
  - What is being challenged?
  - On what basis?
  - Who is responsible for resolving or maintaining the contestation?
  what_it_is_not:
  - automatic invalidation
  - deletion
  - mere disagreement without a referable object
  required_relations:
  - core.rel.contests
  - core.rel.raised-by
  conditional_relations:
  - core.rel.exists-in
  - core.rel.has-provenance
  - core.rel.reviewed-by
  - core.rel.resolved-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Disagreement must remain visible, attributable, and reviewable to preserve correction capability.
  layer: epistemic
