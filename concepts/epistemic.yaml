id: core.concept-group.epistemic
version: 0.1.0
status: experimental
layer: epistemic
concepts:
- id: core.observation
  symbol: Observation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A recorded result of perceiving, measuring, retrieving, or otherwise encountering a Source
    under a declared Context.
  helps_answer:
  - What was observed?
  exclusions:
  - Observation is not a Claim.
  - Observation is not Evidence by default.
  - Observation is not an Interpretation beyond what was recorded.
  required_relations:
  - observedFrom
  - existsIn
  - hasProvenance
  conditional_relations:
  - observedBy
  - hasUncertainty
  - versionedBy
  boundaries:
  - Observation != Claim
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Perception must remain distinct from what the system later asserts about what was perceived.
  layer: epistemic
- id: core.statement
  symbol: Statement
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A semantically typed expression that can be attributed, interpreted, questioned, or asserted
    without implying that it has already been accepted as true.
  not_equivalent_to:
  - Evidence
  exclusions:
  - Statement is not truth.
  - Statement is not a Claim unless asserted as such.
  required_relations: []
  conditional_relations:
  - expressedBy
  - existsIn
  - hasProvenance
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The system needs a neutral expression layer before assertion status is attached.
  layer: epistemic
- id: core.claim
  symbol: Claim
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A Statement asserted as being possibly true or false about an Entity, State, Relation, or
    condition under a declared Context.
  not_equivalent_to:
  - Evidence
  exclusions:
  - Claim is not truth.
  - Claim is not a Finding.
  - Claim is not maintained State by default.
  required_relations:
  - assertedBy
  - existsIn
  conditional_relations:
  - supportedBy
  - contradictedBy
  - hasProvenance
  - hasUncertainty
  - hasValidity
  - contestedBy
  boundaries:
  - Claim != Evidence
  - Evidence != Truth
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Assertions must retain their epistemic status rather than becoming true through fluency,
      repetition, or persistence.
  layer: epistemic
- id: core.evidence
  symbol: Evidence
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable object admitted under a declared Regime as support for, or contradiction of,
    a Claim.
  exclusions:
  - Evidence is not a raw Source.
  - Evidence is not a raw tool result.
  - Evidence is not a Claim.
  - Evidence is not proof of universal truth.
  required_relations:
  - hasProvenance
  - existsIn
  - admittedBy
  conditional_relations:
  - supports
  - contradicts
  - hasValidity
  - hasUncertainty
  - contestedBy
  boundaries:
  - Claim != Evidence
  - Evidence != Truth
  - Validation != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Evidence is a governed epistemic status, not an intrinsic property of any retrieved or
      generated object.
  layer: epistemic
- id: core.inference
  symbol: Inference
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A Derivative conclusion produced by reasoning from one or more Observations, Claims, Evidence
    objects, Findings, or prior Inferences.
  helps_answer:
  - What was inferred?
  not_equivalent_to:
  - Evidence
  - Binding
  exclusions:
  - Inference is not a Finding by default.
  - Inference is not maintained State.
  required_relations:
  - inferredFrom
  - hasProvenance
  conditional_relations:
  - producedBy
  - hasUncertainty
  - hasValidity
  - contestedBy
  boundaries:
  - Inference != Finding
  - Persistence != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Intermediate reasoning must retain provisional status and cannot become institutional truth
      merely by being stored or reused.
  layer: epistemic
- id: core.finding
  symbol: Finding
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual epistemic result produced by evaluating Evidence and Inference under declared
    validity and review conditions.
  not_equivalent_to:
  - BindingDecision
  exclusions:
  - Finding is not universal truth.
  - Finding is not maintained State by default.
  - Finding is not a polished Projection.
  required_relations:
  - derivedFrom
  - hasProvenance
  - hasValidity
  conditional_relations:
  - supportedBy
  - contradictedBy
  - hasUncertainty
  - contestedBy
  - admittedBy
  boundaries:
  - Inference != Finding
  - Finding != BindingDecision
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: A governed result must remain distinguishable from intermediate reasoning and from authority-bearing
      decisions.
  layer: epistemic
- id: core.provenance
  symbol: Provenance
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The reconstructable lineage of origin, attribution, transformation, context, and version
    for a semantic object or relation.
  exclusions:
  - Provenance is not a citation alone.
  - Provenance is not a source identifier alone.
  - Provenance is not proof of validity.
  required_relations: []
  conditional_relations:
  - derivedFrom
  - producedBy
  - versionedBy
  - existsIn
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic continuity requires lineage to survive transfer, composition, persistence, and
      projection.
  layer: epistemic
- id: core.support
  symbol: Support
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable contextual assertion that an allowed semantic object increases warranted acceptance
    of a Claim under declared conditions.
  exclusions:
  - Support is not proof.
  - Support is not truth.
  - Support is not the Evidence object itself.
  - Support is not an unqualified graph edge.
  required_relations:
  - supportSubject
  - supportObject
  - existsIn
  conditional_relations:
  - hasProvenance
  - hasValidity
  - hasUncertainty
  boundaries:
  - Evidence != Truth
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Support may need to be inspected, contested, versioned, or qualified independently from
      the objects it connects.
  layer: epistemic
- id: core.contradiction
  symbol: Contradiction
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable contextual assertion that two semantic objects or positions conflict under declared
    comparison conditions.
  exclusions:
  - Contradiction is not automatic invalidation.
  - Contradiction is not proof that one side is false.
  - Contradiction is not mere difference.
  required_relations:
  - contradictionSubject
  - contradictionObject
  - existsIn
  conditional_relations:
  - hasProvenance
  - hasValidity
  - contestedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Contradiction must remain visible and governable rather than being silently resolved or
      discarded.
  layer: epistemic
- id: core.uncertainty
  symbol: Uncertainty
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit representation of limits, confidence, ambiguity, unknowns, or incompleteness
    associated with a semantic object or relation.
  exclusions:
  - Uncertainty is not an error.
  - Uncertainty is not invalidity by itself.
  - Uncertainty is not a single probability by definition.
  required_relations: []
  conditional_relations:
  - existsIn
  - hasProvenance
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Correction-capable reasoning requires uncertainty to remain explicit across representations
      and downstream use.
  layer: epistemic
- id: core.validity
  symbol: Validity
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The declared status of conformance, applicability, or acceptability of an object or relation
    under a specific Context, Regime, time, and SemanticVersion.
  not_equivalent_to:
  - Admission
  - Binding
  exclusions:
  - Validity is not universal truth.
  - Validity is not runtime success.
  required_relations:
  - existsIn
  conditional_relations:
  - establishedBy
  - versionedBy
  - supersedes
  boundaries:
  - Validation != Admission
  - Evidence != Truth
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Validity is contextual and versioned; it must not silently become universal truth or institutional
      authority.
  layer: epistemic
- id: core.contestation
  symbol: Contestation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit governed challenge to the meaning, support, validity, admission, authority,
    or maintained status of a semantic object or relation.
  exclusions:
  - Contestation is not automatic invalidation.
  - Contestation is not deletion.
  - Contestation is not mere disagreement without a referable object.
  required_relations:
  - contests
  - raisedBy
  conditional_relations:
  - existsIn
  - hasProvenance
  - reviewedBy
  - resolvedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Disagreement must remain visible, attributable, and reviewable to preserve correction capability.
  layer: epistemic
