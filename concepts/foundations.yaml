id: core.concept-group.foundations
version: 0.1.0
status: experimental
layer: foundations
concepts:
- id: core.entity
  name: Entity
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable subject or object of semantic discourse that may retain identity across contexts,
    representations, and StateChanges.
  answers:
  - What is this?
  - What persists as the same thing across change?
  what_it_is_not:
  - a runtime object by definition
  - an Actor by definition
  - an authoritative object by definition
  required_relations:
  - core.rel.has-identity
  conditional_relations:
  - core.rel.exists-in
  - core.rel.bounded-by
  - core.rel.has-state
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: A stable referent is required before meaning, state, provenance, or responsibility can
      be attached.
  layer: foundations
- id: core.identity
  name: Identity
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The declared criteria or reference by which an Entity is treated as the same Entity across
    representations, contexts, and change.
  answers:
  - Which identity does this Entity have?
  - Why are two representations treated as the same Entity?
  what_it_is_not:
  - a display label
  - a semantic type
  - authority
  - a database primary key by necessity
  required_relations: []
  conditional_relations:
  - core.rel.versioned-by
  - core.rel.supersedes
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic continuity requires identity to survive changes in representation and implementation.
  layer: foundations
- id: core.relation
  name: Relation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A typed, directed semantic association whose source, target, meaning, and constraints are
    explicitly declared.
  answers:
  - How are these semantic objects connected?
  - What does the connection mean?
  what_it_is_not:
  - mere co-occurrence
  - an untyped graph edge
  - proof of causality
  required_relations: []
  conditional_relations:
  - core.rel.exists-in
  - core.rel.has-provenance
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The Core is a semantic graph; relations must remain governed rather than inferred from
      adjacency alone.
  layer: foundations
- id: core.context
  name: Context
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A declared interpretive frame within which meaning, validity, comparison, permission, or
    authority applies.
  answers:
  - In which Context does this meaning apply?
  - Under which conditions is this object valid or comparable?
  what_it_is_not:
  - hidden prompt context
  - unbounded environmental data
  - universal truth
  required_relations: []
  conditional_relations:
  - core.rel.bounded-by
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Interpretation, validity, and authority are contextual and must not silently become universal.
  layer: foundations
- id: core.boundary
  name: Boundary
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit rule delimiting identity, meaning, applicability, responsibility, or permissible
    transition.
  answers:
  - Where does this meaning stop applying?
  - Which transition or equivalence is forbidden?
  what_it_is_not:
  - only a network or deployment boundary
  - an implicit convention
  - a runtime guard by necessity
  required_relations: []
  conditional_relations:
  - core.rel.exists-in
  - core.rel.authorized-by
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Correction-capable systems require explicit non-equivalences and responsibility limits.
  layer: foundations
- id: core.state
  name: State
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A maintained representation of what is treated as currently the case for a declared Entity,
    Boundary, and Context.
  answers:
  - What is currently maintained as the case?
  - Which State is active for this Entity and Context?
  what_it_is_not:
  - reality itself
  - a Projection
  - a Claim by default
  - any persisted record
  required_relations:
  - core.rel.state-of
  - core.rel.exists-in
  conditional_relations:
  - core.rel.has-provenance
  - core.rel.has-validity
  - core.rel.versioned-by
  - core.rel.contested-by
  boundaries:
  - core.boundary.projection-not-state
  - core.boundary.persistence-not-admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Systems need a distinguishable maintained ground against which interpretation, action,
      and change can be assessed.
  layer: foundations
- id: core.state-change
  name: StateChange
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An attributable transition from a previous State to a resulting State under a declared Context.
  answers:
  - What changed?
  - What existed before and after?
  - What caused or authorized the transition?
  what_it_is_not:
  - an Action
  - a log entry
  - an event without before-and-after State
  - operational success
  required_relations:
  - core.rel.previous-state
  - core.rel.resulting-state
  - core.rel.exists-in
  conditional_relations:
  - core.rel.caused-by
  - core.rel.authorized-by
  - core.rel.has-provenance
  - core.rel.evaluated-against
  boundaries:
  - core.boundary.action-not-state-change
  - core.boundary.operational-success-not-goal-progress
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Change must remain explicit, attributable, and reconstructable rather than inferred from
      current values alone.
  layer: foundations
- id: core.source
  name: Source
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable origin from which an Observation, Derivative, Interpretation, or other semantic
    object is obtained.
  answers:
  - Where did this object come from?
  - What origin can be inspected independently?
  what_it_is_not:
  - Evidence by default
  - truth
  - a citation alone
  - a Projection
  required_relations: []
  conditional_relations:
  - core.rel.exists-in
  - core.rel.has-identity
  - core.rel.versioned-by
  boundaries:
  - core.boundary.source-not-projection
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Lineage requires a distinguishable origin that derived representations cannot redefine.
  layer: foundations
- id: core.derivative
  name: Derivative
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A semantic object produced through a declared transformation from one or more Sources or
    prior semantic objects.
  answers:
  - From what was this object derived?
  - Which transformation produced it?
  what_it_is_not:
  - its Source
  - automatically authoritative
  - automatically valid
  required_relations:
  - core.rel.derived-from
  - core.rel.has-provenance
  conditional_relations:
  - core.rel.produced-by
  - core.rel.exists-in
  - core.rel.versioned-by
  boundaries:
  - core.boundary.source-not-projection
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Derived content must remain distinguishable from origin and must not inherit authority
      implicitly.
  layer: foundations
- id: core.projection
  name: Projection
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A purpose-oriented Derivative that represents, selects, summarizes, or composes semantic
    objects for a declared audience or use.
  answers:
  - How is underlying State or knowledge being represented?
  - For which purpose was this representation produced?
  what_it_is_not:
  - Source
  - maintained State
  - Binding
  - authority merely because it is final or visible
  required_relations:
  - core.rel.projects
  - core.rel.has-provenance
  conditional_relations:
  - core.rel.exists-in
  - core.rel.governed-by
  - core.rel.versioned-by
  boundaries:
  - core.boundary.source-not-projection
  - core.boundary.projection-not-state
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Organizations require representations, but representations must not become indistinguishable
      from their sources or maintained State.
  layer: foundations
- id: core.interpretation
  name: Interpretation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual assignment of meaning to a Source, Observation, State, Relation, or Derivative.
  answers:
  - Which interpretation produced this meaning?
  - Under which Context was the interpretation made?
  what_it_is_not:
  - Observation
  - Evidence
  - truth
  - authority
  required_relations:
  - core.rel.interprets
  - core.rel.exists-in
  conditional_relations:
  - core.rel.has-provenance
  - core.rel.performed-by
  - core.rel.versioned-by
  boundaries:
  - core.boundary.observation-not-claim
  - core.boundary.projection-not-state
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Interpretation is unavoidable; making it explicit prevents it from silently masquerading
      as direct reality.
  layer: foundations
- id: core.semantic-version
  name: SemanticVersion
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A stable identifier for a governed state of meaning, boundaries, or composition used to
    support compatibility and historical reconstruction.
  answers:
  - Which meaning governed this object or execution?
  - Can the historical interpretation be reconstructed?
  what_it_is_not:
  - necessarily a software release
  - a timestamp alone
  - authority by itself
  required_relations: []
  conditional_relations:
  - core.rel.supersedes
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Historical objects must remain interpretable under the meaning active when they were created,
      admitted, or bound.
  layer: foundations
