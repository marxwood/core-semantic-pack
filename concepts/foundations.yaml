id: core.concept-group.foundations
version: 0.1.0
status: experimental
layer: foundations
concepts:
- id: core.entity
  symbol: Entity
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable subject or object of semantic discourse that may retain identity across contexts,
    representations, and StateChanges.
  helps_answer:
  - What is this?
  exclusions:
  - Entity is not a runtime object by definition.
  - Entity is not an Actor by definition.
  - Entity is not an authoritative object by definition.
  required_relations:
  - hasIdentity
  conditional_relations:
  - existsIn
  - boundedBy
  - hasState
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: A stable referent is required before meaning, state, provenance, or responsibility can
      be attached.
  layer: foundations
- id: core.identity
  symbol: Identity
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The declared criteria or reference by which an Entity is treated as the same Entity across
    representations, contexts, and change.
  exclusions:
  - Identity is not a display label.
  - Identity is not a semantic type.
  - Identity is not authority.
  - Identity is not a database primary key by necessity.
  required_relations: []
  conditional_relations:
  - versionedBy
  - supersedes
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic continuity requires identity to survive changes in representation and implementation.
  layer: foundations
- id: core.relation
  symbol: Relation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A typed, directed semantic association whose source, target, meaning, and constraints are
    explicitly declared.
  exclusions:
  - Relation is not mere co-occurrence.
  - Relation is not an untyped graph edge.
  - Relation is not proof of causality.
  required_relations: []
  conditional_relations:
  - existsIn
  - hasProvenance
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The Core is a semantic graph; relations must remain governed rather than inferred from
      adjacency alone.
  layer: foundations
- id: core.context
  symbol: Context
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A declared interpretive frame within which meaning, validity, comparison, permission, or
    authority applies.
  helps_answer:
  - In which Context does this meaning apply?
  exclusions:
  - Context is not hidden prompt context.
  - Context is not unbounded environmental data.
  - Context is not universal truth.
  required_relations: []
  conditional_relations:
  - boundedBy
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Interpretation, validity, and authority are contextual and must not silently become universal.
  layer: foundations
- id: core.boundary
  symbol: Boundary
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit rule delimiting identity, meaning, applicability, responsibility, or permissible
    transition.
  exclusions:
  - Boundary is not only a network or deployment boundary.
  - Boundary is not an implicit convention.
  - Boundary is not a runtime guard by necessity.
  required_relations: []
  conditional_relations:
  - existsIn
  - authorizedBy
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Correction-capable systems require explicit non-equivalences and responsibility limits.
  layer: foundations
- id: core.state
  symbol: State
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A maintained representation of what is treated as currently the case for a declared Entity,
    Boundary, and Context.
  exclusions:
  - State is not reality itself.
  - State is not a Projection.
  - State is not a Claim by default.
  - State is not any persisted record.
  required_relations:
  - stateOf
  - existsIn
  conditional_relations:
  - hasProvenance
  - hasValidity
  - versionedBy
  - contestedBy
  boundaries:
  - Projection != State
  - Persistence != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Systems need a distinguishable maintained ground against which interpretation, action,
      and change can be assessed.
  layer: foundations
- id: core.state-change
  symbol: StateChange
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An attributable transition from a previous State to a resulting State under a declared Context.
  helps_answer:
  - What changed?
  exclusions:
  - StateChange is not an Action.
  - StateChange is not a log entry.
  - StateChange is not an event without before-and-after State.
  - StateChange is not operational success.
  required_relations:
  - previousState
  - resultingState
  - existsIn
  conditional_relations:
  - causedBy
  - authorizedBy
  - hasProvenance
  - evaluatedAgainst
  boundaries:
  - Action != StateChange
  - OperationalSuccess != Progress
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Change must remain explicit, attributable, and reconstructable rather than inferred from
      current values alone.
  layer: foundations
- id: core.source
  symbol: Source
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A referable origin from which an Observation, Derivative, Interpretation, or other semantic
    object is obtained.
  exclusions:
  - Source is not Evidence by default.
  - Source is not truth.
  - Source is not a citation alone.
  - Source is not a Projection.
  required_relations: []
  conditional_relations:
  - existsIn
  - hasIdentity
  - versionedBy
  boundaries:
  - Source != Projection
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Lineage requires a distinguishable origin that derived representations cannot redefine.
  layer: foundations
- id: core.derivative
  symbol: Derivative
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A semantic object produced through a declared transformation from one or more Sources or
    prior semantic objects.
  exclusions:
  - Derivative is not its Source.
  - Derivative is not automatically authoritative.
  - Derivative is not automatically valid.
  required_relations:
  - derivedFrom
  - hasProvenance
  conditional_relations:
  - producedBy
  - existsIn
  - versionedBy
  boundaries:
  - Source != Projection
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Derived content must remain distinguishable from origin and must not inherit authority
      implicitly.
  layer: foundations
- id: core.projection
  symbol: Projection
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A purpose-oriented Derivative that represents, selects, summarizes, or composes semantic
    objects for a declared audience or use.
  not_equivalent_to:
  - Source
  - Binding
  exclusions:
  - Projection is not maintained State.
  - Projection is not authority merely because it is final or visible.
  required_relations:
  - projects
  - hasProvenance
  conditional_relations:
  - existsIn
  - governedBy
  - versionedBy
  boundaries:
  - Source != Projection
  - Projection != State
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Organizations require representations, but representations must not become indistinguishable
      from their sources or maintained State.
  layer: foundations
- id: core.interpretation
  symbol: Interpretation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual assignment of meaning to a Source, Observation, State, Relation, or Derivative.
  not_equivalent_to:
  - Observation
  - Evidence
  exclusions:
  - Interpretation is not truth.
  - Interpretation is not authority.
  required_relations:
  - interprets
  - existsIn
  conditional_relations:
  - hasProvenance
  - performedBy
  - versionedBy
  boundaries:
  - Observation != Claim
  - Projection != State
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Interpretation is unavoidable; making it explicit prevents it from silently masquerading
      as direct reality.
  layer: foundations
- id: core.semantic-version
  symbol: SemanticVersion
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A stable identifier for a governed state of meaning, boundaries, or composition used to
    support compatibility and historical reconstruction.
  exclusions:
  - SemanticVersion is not necessarily a software release.
  - SemanticVersion is not a timestamp alone.
  - SemanticVersion is not authority by itself.
  required_relations: []
  conditional_relations:
  - supersedes
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Historical objects must remain interpretable under the meaning active when they were created,
      admitted, or bound.
  layer: foundations
