id: core.concept-group.governance
version: 0.1.0
status: experimental
layer: governance
concepts:
- id: core.authority
  symbol: Authority
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: Declared and attributable legitimacy to authorize Action, admit State, establish Binding,
    or otherwise create normative consequence within a defined scope.
  not_equivalent_to:
  - Capability
  exclusions:
  - Authority is not ownership by itself.
  - Authority is not Role by itself.
  - Authority is not technical access.
  required_relations:
  - heldBy
  - existsIn
  conditional_relations:
  - boundedBy
  - constrainedBy
  - versionedBy
  - revokedBy
  boundaries:
  - Capability != Authority
  - Intent != Authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Authority must never emerge implicitly from technical capability, persistence, visibility,
      or repeated downstream use.
  layer: governance
- id: core.constraint
  symbol: Constraint
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit condition that limits interpretation, permission, transformation, admission,
    review, binding, or other semantic use.
  exclusions:
  - Constraint is not a suggestion.
  - Constraint is not an implicit convention.
  - Constraint is not a runtime check by necessity.
  required_relations: []
  conditional_relations:
  - appliesTo
  - authorizedBy
  - existsIn
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Normative limits need stable meaning independent of the mechanism used to enforce them.
  layer: governance
- id: core.permission
  symbol: Permission
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A scoped allowance granted by Authority for an Actor, Role, Action, or Process participation
    under declared Constraints and Context.
  not_equivalent_to:
  - Capability
  exclusions:
  - Permission is not Authority itself.
  - Permission is not successful authentication.
  - Permission is not unbounded access.
  required_relations:
  - authorizedBy
  - permits
  conditional_relations:
  - constrainedBy
  - existsIn
  - revokedBy
  - versionedBy
  boundaries:
  - Capability != Authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The ability to act and the allowance to act must remain distinct and scope-bound.
  layer: governance
- id: core.contract
  symbol: Contract
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A versioned set of semantic obligations, constraints, validity conditions, and permitted
    transitions applying across declared roles, components, or boundaries.
  not_equivalent_to:
  - ExecutionPlan
  exclusions:
  - Contract is not a legal contract by necessity.
  - Contract is not Workflow.
  - Contract is not runtime configuration.
  required_relations:
  - existsIn
  - versionedBy
  conditional_relations:
  - constrainedBy
  - authorizedBy
  - appliesTo
  boundaries:
  - Process != ExecutionContract
  - ExecutionContract != ExecutionPlan
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic obligations must remain stable while their runtime enforcement and orchestration
      mechanisms evolve.
  layer: governance
- id: core.validation
  symbol: Validation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An assessment of whether a candidate semantic object, relation, or transition conforms to
    declared requirements.
  not_equivalent_to:
  - Admission
  - Binding
  exclusions:
  - Validation is not truth determination.
  - Validation is not authority.
  required_relations:
  - validatesObject
  conditional_relations:
  - performedBy
  - governedBy
  - hasProvenance
  - existsIn
  boundaries:
  - Validation != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Syntactic or semantic conformance must not automatically promote an object into maintained
      governed State.
  layer: governance
- id: core.admission
  symbol: Admission
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit governed transition by which a candidate object is allowed to become maintained
    State or acquire another declared admitted status.
  not_equivalent_to:
  - Validation
  - Persistence
  - Review
  exclusions:
  - Admission is not truth.
  required_relations:
  - admitsObject
  - authorizedBy
  conditional_relations:
  - governedBy
  - producesState
  - hasProvenance
  - existsIn
  - revokedBy
  boundaries:
  - Validation != Admission
  - Persistence != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Institutional memory and maintained State require an explicit status transition rather
      than implicit promotion through storage or reuse.
  layer: governance
- id: core.review
  symbol: Review
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An attributable evaluative act that may validate, contest, annotate, reject, or recommend
    change to a semantic object or transition.
  not_equivalent_to:
  - Binding
  exclusions:
  - Review is not Authority by itself.
  - Review is not Admission by itself.
  - Review is not automatic approval.
  required_relations:
  - reviewsObject
  - performedBy
  conditional_relations:
  - governedBy
  - hasProvenance
  - existsIn
  boundaries:
  - Review != Binding
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Human or automated review must remain separate from the authority act that creates institutional
      commitment.
  layer: governance
- id: core.binding
  symbol: Binding
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An authority-bearing act that makes a decision, obligation, or Commitment operative within
    a declared scope.
  not_equivalent_to:
  - Review
  - Validation
  - Finding
  exclusions:
  - Binding is not visibility.
  required_relations:
  - establishesCommitment
  - authorizedBy
  conditional_relations:
  - governedBy
  - hasProvenance
  - existsIn
  - revokedBy
  boundaries:
  - Review != Binding
  - Finding != BindingDecision
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Institutional consequence requires an explicit authority act rather than being inferred
      from evaluation or polished output.
  layer: governance
- id: core.commitment
  symbol: Commitment
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A maintained obligation, decision, or declared course accepted as operative through Binding
    within a defined scope.
  not_equivalent_to:
  - Goal
  - Intent
  - Finding
  exclusions:
  - Commitment is not Recommendation.
  required_relations:
  - establishedBy
  conditional_relations:
  - accountableTo
  - constrainedBy
  - existsIn
  - versionedBy
  - revokedBy
  boundaries:
  - Finding != BindingDecision
  - Review != Binding
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Binding consequences need a maintained referent that can guide action and later be revised
      or revoked.
  layer: governance
- id: core.revocation
  symbol: Revocation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An authorized act that withdraws previously granted Authority, Permission, Admission, Binding,
    or Commitment while preserving historical lineage.
  exclusions:
  - Revocation is not deletion.
  - Revocation is not forgetting.
  - Revocation is not automatic expiry.
  - Revocation is not contestation alone.
  required_relations:
  - revokesObject
  - authorizedBy
  conditional_relations:
  - hasProvenance
  - existsIn
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Correction capability requires institutional consequences to remain withdrawable without
      erasing history.
  layer: governance
- id: core.accountability
  symbol: Accountability
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An assignable responsibility for a semantic object, decision, Commitment, Action, or StateChange
    together with an obligation to explain, correct, or escalate it.
  exclusions:
  - Accountability is not Provenance alone.
  - Accountability is not Authority alone.
  - Accountability is not ownership alone.
  - Accountability is not blame attribution.
  required_relations:
  - accountableActor
  - accountableObject
  conditional_relations:
  - existsIn
  - authorizedBy
  - versionedBy
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Attribution of origin is insufficient unless responsibility for correction and consequence
      is also explicit.
  layer: governance
