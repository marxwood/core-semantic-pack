id: core.concept-group.governance
version: 0.1.0
status: experimental
layer: governance
concepts:
- id: core.authority
  name: Authority
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: Declared and attributable legitimacy to authorize Action, admit State, establish Binding,
    or otherwise create normative consequence within a defined scope.
  answers:
  - Who or what legitimizes this consequence?
  - Within which scope and Context does that legitimacy apply?
  what_it_is_not:
  - Capability
  - ownership by itself
  - Role by itself
  - technical access
  required_relations:
  - core.rel.held-by
  - core.rel.exists-in
  conditional_relations:
  - core.rel.bounded-by
  - core.rel.constrained-by
  - core.rel.versioned-by
  - core.rel.revoked-by
  boundaries:
  - core.boundary.capability-not-authority
  - core.boundary.intent-not-authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Authority must never emerge implicitly from technical capability, persistence, visibility,
      or repeated downstream use.
  layer: governance
- id: core.constraint
  name: Constraint
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit condition that limits interpretation, permission, transformation, admission,
    review, binding, or other semantic use.
  answers:
  - What is limited?
  - Under which condition does the limit apply?
  - What happens when it is violated?
  what_it_is_not:
  - a suggestion
  - an implicit convention
  - a runtime check by necessity
  required_relations: []
  conditional_relations:
  - core.rel.applies-to
  - core.rel.authorized-by
  - core.rel.exists-in
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Normative limits need stable meaning independent of the mechanism used to enforce them.
  layer: governance
- id: core.permission
  name: Permission
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A scoped allowance granted by Authority for an Actor, Role, Action, or Process participation
    under declared Constraints and Context.
  answers:
  - What is allowed?
  - Who or what is allowed to do it?
  - Which Authority granted the allowance?
  what_it_is_not:
  - Capability
  - Authority itself
  - successful authentication
  - unbounded access
  required_relations:
  - core.rel.authorized-by
  - core.rel.permits
  conditional_relations:
  - core.rel.constrained-by
  - core.rel.exists-in
  - core.rel.revoked-by
  - core.rel.versioned-by
  boundaries:
  - core.boundary.capability-not-authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The ability to act and the allowance to act must remain distinct and scope-bound.
  layer: governance
- id: core.contract
  name: Contract
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A versioned set of semantic obligations, constraints, validity conditions, and permitted
    transitions applying across declared roles, components, or boundaries.
  answers:
  - Which obligations govern this interaction or execution?
  - Which conditions make the transition legitimate?
  what_it_is_not:
  - a legal contract by necessity
  - Workflow
  - ExecutionPlan
  - runtime configuration
  required_relations:
  - core.rel.exists-in
  - core.rel.versioned-by
  conditional_relations:
  - core.rel.constrained-by
  - core.rel.authorized-by
  - core.rel.applies-to
  boundaries:
  - core.boundary.process-not-execution-contract
  - core.boundary.execution-contract-not-execution-plan
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic obligations must remain stable while their runtime enforcement and orchestration
      mechanisms evolve.
  layer: governance
- id: core.validation
  name: Validation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An assessment of whether a candidate semantic object, relation, or transition conforms to
    declared requirements.
  answers:
  - Does the candidate conform?
  - Which rules were evaluated and with what result?
  what_it_is_not:
  - Admission
  - truth determination
  - Binding
  - authority
  required_relations:
  - core.rel.validates-object
  conditional_relations:
  - core.rel.performed-by
  - core.rel.governed-by
  - core.rel.has-provenance
  - core.rel.exists-in
  boundaries:
  - core.boundary.validation-not-admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Syntactic or semantic conformance must not automatically promote an object into maintained
      governed State.
  layer: governance
- id: core.admission
  name: Admission
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An explicit governed transition by which a candidate object is allowed to become maintained
    State or acquire another declared admitted status.
  answers:
  - May this candidate become maintained governed State?
  - Who or what admitted it and under which Regime?
  what_it_is_not:
  - Validation
  - Persistence
  - Review
  - truth
  required_relations:
  - core.rel.admits-object
  - core.rel.authorized-by
  conditional_relations:
  - core.rel.governed-by
  - core.rel.produces-state
  - core.rel.has-provenance
  - core.rel.exists-in
  - core.rel.revoked-by
  boundaries:
  - core.boundary.validation-not-admission
  - core.boundary.persistence-not-admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Institutional memory and maintained State require an explicit status transition rather
      than implicit promotion through storage or reuse.
  layer: governance
- id: core.review
  name: Review
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An attributable evaluative act that may validate, contest, annotate, reject, or recommend
    change to a semantic object or transition.
  answers:
  - What was reviewed?
  - By whom?
  - What evaluative outcome was produced?
  what_it_is_not:
  - Binding
  - Authority by itself
  - Admission by itself
  - automatic approval
  required_relations:
  - core.rel.reviews-object
  - core.rel.performed-by
  conditional_relations:
  - core.rel.governed-by
  - core.rel.has-provenance
  - core.rel.exists-in
  boundaries:
  - core.boundary.review-not-binding
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Human or automated review must remain separate from the authority act that creates institutional
      commitment.
  layer: governance
- id: core.binding
  name: Binding
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An authority-bearing act that makes a decision, obligation, or Commitment operative within
    a declared scope.
  answers:
  - What became institutionally operative?
  - Which Authority established the consequence?
  what_it_is_not:
  - Review
  - Validation
  - Finding
  - visibility
  required_relations:
  - core.rel.establishes-commitment
  - core.rel.authorized-by
  conditional_relations:
  - core.rel.governed-by
  - core.rel.has-provenance
  - core.rel.exists-in
  - core.rel.revoked-by
  boundaries:
  - core.boundary.review-not-binding
  - core.boundary.finding-not-binding-decision
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Institutional consequence requires an explicit authority act rather than being inferred
      from evaluation or polished output.
  layer: governance
- id: core.commitment
  name: Commitment
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A maintained obligation, decision, or declared course accepted as operative through Binding
    within a defined scope.
  answers:
  - What obligation or decision is currently operative?
  - Who is accountable for maintaining, revising, or revoking it?
  what_it_is_not:
  - Goal
  - Intent
  - Recommendation
  - Finding
  required_relations:
  - core.rel.established-by
  conditional_relations:
  - core.rel.accountable-to
  - core.rel.constrained-by
  - core.rel.exists-in
  - core.rel.versioned-by
  - core.rel.revoked-by
  boundaries:
  - core.boundary.finding-not-binding-decision
  - core.boundary.review-not-binding
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Binding consequences need a maintained referent that can guide action and later be revised
      or revoked.
  layer: governance
- id: core.revocation
  name: Revocation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An authorized act that withdraws previously granted Authority, Permission, Admission, Binding,
    or Commitment while preserving historical lineage.
  answers:
  - What governed status was withdrawn?
  - Who authorized the withdrawal?
  - What remains historically reconstructable?
  what_it_is_not:
  - deletion
  - forgetting
  - automatic expiry
  - contestation alone
  required_relations:
  - core.rel.revokes-object
  - core.rel.authorized-by
  conditional_relations:
  - core.rel.has-provenance
  - core.rel.exists-in
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Correction capability requires institutional consequences to remain withdrawable without
      erasing history.
  layer: governance
- id: core.accountability
  name: Accountability
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An assignable responsibility for a semantic object, decision, Commitment, Action, or StateChange
    together with an obligation to explain, correct, or escalate it.
  answers:
  - Who is responsible for this object or consequence?
  - Who must explain or correct it?
  what_it_is_not:
  - Provenance alone
  - Authority alone
  - ownership alone
  - blame attribution
  required_relations:
  - core.rel.accountable-actor
  - core.rel.accountable-object
  conditional_relations:
  - core.rel.exists-in
  - core.rel.authorized-by
  - core.rel.versioned-by
  boundaries: []
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Attribution of origin is insufficient unless responsibility for correction and consequence
      is also explicit.
  layer: governance
