id: core.concept-group.agency
version: 0.1.0
status: experimental
layer: agency
concepts:
- id: core.actor
  symbol: Actor
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An Entity to which a Role, Intent, Action, Review, decision, or responsibility may be attributed.
  exclusions:
  - Actor is not Authority by default.
  - Actor is not a human only.
  - Actor is not an agent only.
  - Actor is not a Capability.
  required_relations:
  - hasIdentity
  conditional_relations:
  - occupiesRole
  - hasCapability
  - accountableFor
  - existsIn
  boundaries:
  - Capability != Authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Attribution must work across humans, agents, organizations, and composite actors without
      granting implicit legitimacy.
  layer: agency
- id: core.role
  symbol: Role
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A contextual position of responsibility that constrains expected, permitted, or accountable
    participation in a Process or governance act.
  not_equivalent_to:
  - Actor
  - Capability
  exclusions:
  - Role is not Authority by default.
  - Role is not job title by necessity.
  required_relations: []
  conditional_relations:
  - occupiedBy
  - hasCapability
  - constrainedBy
  - governedBy
  - existsIn
  boundaries:
  - Capability != Authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The same Actor may participate under different responsibilities and permissions in different
      contexts.
  layer: agency
- id: core.capability
  symbol: Capability
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A declared ability to perform an operation, transformation, interpretation, or other class
    of work.
  not_equivalent_to:
  - Authority
  - Permission
  - Intent
  exclusions:
  - Capability is not successful execution.
  required_relations: []
  conditional_relations:
  - heldBy
  - constrainedBy
  - existsIn
  - versionedBy
  boundaries:
  - Capability != Authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Ability must remain separate from legitimacy; increasing capability must not silently expand
      authority.
  layer: agency
- id: core.action
  symbol: Action
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An attributable attempt or performance by an Actor to realize an Intent, participate in
    a Process, transform an object, or produce an effect.
  not_equivalent_to:
  - Intent
  - StateChange
  - Authority
  exclusions:
  - Action is not proof of Progress.
  required_relations:
  - performedBy
  - realizes
  - participatesIn
  conditional_relations:
  - authorizedBy
  - permittedBy
  - constrainedBy
  - transforms
  - produces
  - causes
  - existsIn
  boundaries:
  - Action != Intent
  - Action != StateChange
  - OperationalSuccess != Progress
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Execution must remain traceable to purpose, process, actor, and authority without being
      equated with its consequence.
  layer: agency
- id: core.process
  symbol: Process
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An abstract semantic structure of possible transformations, causal relations, State transition
    logic, and invariants.
  not_equivalent_to:
  - ExecutionContract
  - ExecutionPlan
  - Runtime
  exclusions:
  - Process is not Workflow implementation.
  required_relations: []
  conditional_relations:
  - comprisesTransformation
  - governedBy
  - existsIn
  - versionedBy
  boundaries:
  - Process != ExecutionContract
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: The ontology of change must remain distinct from the contextual legitimacy and implementation
      of execution.
  layer: agency
- id: core.transformation
  symbol: Transformation
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: A declared conversion of semantic inputs, objects, or States into outputs, Derivatives,
    or resulting States.
  exclusions:
  - Transformation is not Process as a whole.
  - Transformation is not StateChange by definition.
  - Transformation is not Action by definition.
  - Transformation is not Runtime step by necessity.
  required_relations: []
  conditional_relations:
  - inputOf
  - outputOf
  - partOfProcess
  - producedBy
  - existsIn
  - versionedBy
  boundaries:
  - Action != StateChange
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Transformation meaning should survive whether realized by a human, agent, tool, model,
      or other runtime mechanism.
  layer: agency
- id: core.transfer
  symbol: Transfer
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The movement of a semantic object or responsibility between Actors, Contexts, or Boundaries
    under declared interpretation and provenance obligations.
  exclusions:
  - Transfer is not a copy by definition.
  - Transfer is not a runtime handoff by definition.
  - Transfer is not Admission into the receiving context.
  required_relations:
  - transfersObject
  - fromContext
  - toContext
  conditional_relations:
  - hasProvenance
  - governedBy
  - authorizedBy
  boundaries:
  - Persistence != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Semantic status and provenance must survive movement across system and organizational boundaries.
  layer: agency
- id: core.persistence
  symbol: Persistence
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The retention of a semantic object or State across time or a processing boundary.
  not_equivalent_to:
  - Admission
  exclusions:
  - Persistence is not validity.
  - Persistence is not authority.
  - Persistence is not institutional truth.
  required_relations:
  - persistsObject
  conditional_relations:
  - governedBy
  - hasProvenance
  - existsIn
  - versionedBy
  boundaries:
  - Persistence != Admission
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Storage must not manufacture governed status or erase the type and lineage of what is stored.
  layer: agency
- id: core.composition
  symbol: Composition
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: The governed creation of a Derivative from multiple semantic objects under declared selection,
    ordering, and interpretation rules.
  exclusions:
  - Composition is not aggregation without meaning.
  - Composition is not a Projection by necessity.
  - Composition is not authority inherited from components.
  required_relations:
  - composesObject
  - produces
  conditional_relations:
  - hasProvenance
  - governedBy
  - existsIn
  - versionedBy
  boundaries:
  - Source != Projection
  - Projection != State
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Composite outputs must preserve lineage and cannot silently inherit status or authority
      from their inputs.
  layer: agency
- id: core.external-effect
  symbol: ExternalEffect
  version: 0.1.0
  status: experimental
  kind: candidate-core-primitive
  definition: An authorized consequence that changes State outside the declared boundary of the governed
    Process or semantic environment.
  exclusions:
  - ExternalEffect is not a Projection.
  - ExternalEffect is not Recommendation.
  - ExternalEffect is not tool output.
  - ExternalEffect is not an internal StateChange only.
  required_relations:
  - causedBy
  - authorizedBy
  - crossesBoundary
  conditional_relations:
  - hasProvenance
  - resultingState
  - existsIn
  boundaries:
  - Review != Binding
  - Capability != Authority
  derivation:
    source: CORE-SEMANTIC-PACK.md
    status: working-reference
    rationale: Consequences beyond a governed process require explicit legitimacy and reconstructable
      causation.
  layer: agency
