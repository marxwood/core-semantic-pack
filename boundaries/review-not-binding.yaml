id: core.boundary.review-not-binding
version: 0.1.0
status: experimental

expression: Review != Binding

left: Review
operator: '!='
right: Binding

rule: >-
  Review must not be treated as Binding unless a separately authorized Binding act is declared.

rationale: >-
  Evaluation and institutional commitment are different responsibilities.

