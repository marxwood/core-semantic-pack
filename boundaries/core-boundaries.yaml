id: core.boundary-catalog
version: 0.1.0
status: experimental
boundaries:
- id: core.boundary.source-not-projection
  expression: Source != Projection
  version: 0.1.0
  status: experimental
  left: Source
  operator: '!='
  right: Projection
  rule: A Projection must remain distinguishable from the Source or State it represents.
  rationale: Derived representations do not redefine their source.
  failure_code: SEM-BOUNDARY-001
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.observation-not-claim
  expression: Observation != Claim
  version: 0.1.0
  status: experimental
  left: Observation
  operator: '!='
  right: Claim
  rule: An Observation must not be represented as a Claim without an explicit assertion or interpretation
    transition.
  rationale: Perception and assertion are different epistemic acts.
  failure_code: SEM-BOUNDARY-002
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.claim-not-evidence
  expression: Claim != Evidence
  version: 0.1.0
  status: experimental
  left: Claim
  operator: '!='
  right: Evidence
  rule: A Claim must not be used as Evidence for itself or acquire Evidence status without a declared
    Admission.
  rationale: Assertions do not provide their own support.
  failure_code: SEM-BOUNDARY-003
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.evidence-not-truth
  expression: Evidence != Truth
  version: 0.1.0
  status: experimental
  left: Evidence
  operator: '!='
  right: Truth
  rule: Evidence must not be represented as universal truth; it supports or contradicts Claims under declared
    conditions.
  rationale: Evidence remains contextual, contestable, and regime-bound.
  failure_code: SEM-BOUNDARY-004
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.inference-not-finding
  expression: Inference != Finding
  version: 0.1.0
  status: experimental
  left: Inference
  operator: '!='
  right: Finding
  rule: An Inference must not be represented as a Finding without the declared evaluation, validity, and
    governance conditions required for a Finding.
  rationale: Intermediate reasoning does not silently become a governed result.
  failure_code: SEM-BOUNDARY-005
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.finding-not-binding-decision
  expression: Finding != BindingDecision
  version: 0.1.0
  status: experimental
  left: Finding
  operator: '!='
  right: BindingDecision
  rule: A Finding must not create institutional commitment or external consequence without a separate
    Binding act.
  rationale: Epistemic result and normative decision are different responsibilities.
  failure_code: SEM-BOUNDARY-006
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.projection-not-state
  expression: Projection != State
  version: 0.1.0
  status: experimental
  left: Projection
  operator: '!='
  right: State
  rule: A Projection must not be represented or persisted as maintained State without an explicit Admission
    and StateChange.
  rationale: Visibility, polish, or downstream use does not create authority.
  failure_code: SEM-BOUNDARY-007
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.validation-not-admission
  expression: Validation != Admission
  version: 0.1.0
  status: experimental
  left: Validation
  operator: '!='
  right: Admission
  rule: Successful Validation must not automatically admit a candidate into maintained State.
  rationale: Conformance and governed acceptance are distinct transitions.
  failure_code: SEM-BOUNDARY-008
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.review-not-binding
  expression: Review != Binding
  version: 0.1.0
  status: experimental
  left: Review
  operator: '!='
  right: Binding
  rule: Review must not be treated as Binding unless a separately authorized Binding act is declared.
  rationale: Evaluation and institutional commitment are different responsibilities.
  failure_code: SEM-BOUNDARY-009
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.capability-not-authority
  expression: Capability != Authority
  version: 0.1.0
  status: experimental
  left: Capability
  operator: '!='
  right: Authority
  rule: Capability must not create or imply Authority, Permission, or legitimacy.
  rationale: Ability to act is not authorization to act.
  failure_code: SEM-BOUNDARY-010
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.persistence-not-admission
  expression: Persistence != Admission
  version: 0.1.0
  status: experimental
  left: Persistence
  operator: '!='
  right: Admission
  rule: Persisting an object must not admit it into maintained governed State or change its epistemic
    status.
  rationale: Storage does not manufacture institutional truth.
  failure_code: SEM-BOUNDARY-011
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.repetition-not-validation
  expression: Repetition != Validation
  version: 0.1.0
  status: experimental
  left: Repetition
  operator: '!='
  right: Validation
  rule: Repeated appearance or downstream reuse of an object must not be treated as Validation.
  rationale: Propagation does not add evidence or evaluate conformance.
  failure_code: SEM-BOUNDARY-012
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.goal-not-desired-state
  expression: Goal != DesiredState
  version: 0.1.0
  status: experimental
  left: Goal
  operator: '!='
  right: DesiredState
  rule: A Goal must remain distinct from the DesiredState used to represent its future condition.
  rationale: Normative objective and future-state representation serve different functions.
  failure_code: SEM-BOUNDARY-013
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.desired-state-not-prediction
  expression: DesiredState != Prediction
  version: 0.1.0
  status: experimental
  left: DesiredState
  operator: '!='
  right: Prediction
  rule: DesiredState must not be represented as a Prediction of what will occur.
  rationale: Normative future and expected future are different semantics.
  failure_code: SEM-BOUNDARY-014
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.desired-state-not-plan
  expression: DesiredState != Plan
  version: 0.1.0
  status: experimental
  left: DesiredState
  operator: '!='
  right: Plan
  rule: DesiredState must not be represented as the plan or sequence by which it may be reached.
  rationale: Target condition and execution path are different semantics.
  failure_code: SEM-BOUNDARY-015
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.intent-not-goal
  expression: Intent != Goal
  version: 0.1.0
  status: experimental
  left: Intent
  operator: '!='
  right: Goal
  rule: Intent must remain traceable to a Goal without being represented as the Goal itself.
  rationale: Immediate purpose and enduring normative objective are different levels.
  failure_code: SEM-BOUNDARY-016
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.intent-not-authority
  expression: Intent != Authority
  version: 0.1.0
  status: experimental
  left: Intent
  operator: '!='
  right: Authority
  rule: Intent must not create Authority or Permission to act.
  rationale: Purpose does not legitimize consequence.
  failure_code: SEM-BOUNDARY-017
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.action-not-intent
  expression: Action != Intent
  version: 0.1.0
  status: experimental
  left: Action
  operator: '!='
  right: Intent
  rule: Action must remain distinguishable from the Intent it realizes.
  rationale: What was done and why it was done must remain separately inspectable.
  failure_code: SEM-BOUNDARY-018
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.action-not-state-change
  expression: Action != StateChange
  version: 0.1.0
  status: experimental
  left: Action
  operator: '!='
  right: StateChange
  rule: Action must not be represented as StateChange without evidence of an actual attributable transition.
  rationale: Attempted or completed execution is not identical to changed reality.
  failure_code: SEM-BOUNDARY-019
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.process-not-execution-contract
  expression: Process != ExecutionContract
  version: 0.1.0
  status: experimental
  left: Process
  operator: '!='
  right: ExecutionContract
  rule: Process must remain distinct from the ExecutionContract that governs when and under which conditions
    it may be realized.
  rationale: Ontology of change and legitimacy of execution are separate layers.
  failure_code: SEM-BOUNDARY-020
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.execution-contract-not-execution-plan
  expression: ExecutionContract != ExecutionPlan
  version: 0.1.0
  status: experimental
  left: ExecutionContract
  operator: '!='
  right: ExecutionPlan
  rule: ExecutionContract must not be reduced to the concrete ordering, bindings, or orchestration of
    an ExecutionPlan.
  rationale: Semantic legitimacy must survive changes in runtime realization.
  failure_code: SEM-BOUNDARY-021
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.execution-plan-not-runtime
  expression: ExecutionPlan != Runtime
  version: 0.1.0
  status: experimental
  left: ExecutionPlan
  operator: '!='
  right: Runtime
  rule: ExecutionPlan must remain distinguishable from the execution that actually occurred.
  rationale: Planned realization and historical execution are different states.
  failure_code: SEM-BOUNDARY-022
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
- id: core.boundary.operational-success-not-goal-progress
  expression: OperationalSuccess != Progress
  version: 0.1.0
  status: experimental
  left: OperationalSuccess
  operator: '!='
  right: Progress
  rule: Successful execution must not be represented as Progress without evaluation against DesiredState
    or Direction.
  rationale: A correct Action can move the system in the wrong direction.
  failure_code: SEM-BOUNDARY-023
  severity: semantic-error
  applies_to:
  - concept-records
  - question-contracts
  - patterns
  - mappings
  - conformance
