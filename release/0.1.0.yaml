known_limitations:
- Type is required for answerability but is not admitted as a Core primitive.
- Regime is represented as a pack/composition responsibility, not a Core primitive.
- BindingDecision is represented through Binding plus Commitment.
- Reflection composes existing primitives rather than defining an independent primitive set.
- The current validator checks structural integrity and declared fixture expectations, not semantic truth.
- Question fixtures are representative; not every canonical question wording has an independent fixture.
- Release commit and publication time must be assigned after merge or tagging.
