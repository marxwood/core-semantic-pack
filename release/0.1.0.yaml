known_limitations:
  - Type is required for answerability but is not admitted as a Core primitive.
  - Detailed per-Regime enumerative matrices are exploratory candidates awaiting explicit Canon review.
  - BindingDecision is represented through Binding plus Commitment.
  - Reflection composes existing primitives rather than defining an independent primitive set.
  - The general validator checks structural integrity and declared fixture expectations, not semantic truth.
  - The Regime validator checks Regime structure, identity, composition boundaries, and dedicated fixtures; it does not establish Validity of real-world Claims.
  - Question fixtures are representative; atomic question contracts do not yet each have dedicated runtime fixtures.
  - Release commit and publication time must be assigned after merge or tagging.

