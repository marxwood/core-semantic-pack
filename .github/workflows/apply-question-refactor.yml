name: Apply atomic question refactor

on:
  push:
    branches:
      - feat/materialize-core-semantic-pack-v0.1
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/materialize-core-semantic-pack-v0.1' || github.ref == 'refs/heads/feat/materialize-core-semantic-pack-v0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/materialize-core-semantic-pack-v0.1
          fetch-depth: 0

      - name: Decode and materialize payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, io, json, tarfile

          root = Path('.')
          payload_path = root / '.bootstrap/question-refactor.part-00'
          raw = base64.b64decode(payload_path.read_text(encoding='utf-8').strip())
          data = gzip.decompress(raw)

          applied = False
          try:
              bio = io.BytesIO(data)
              with tarfile.open(fileobj=bio, mode='r:*') as tf:
                  members = tf.getmembers()
                  for m in members:
                      target = (root / m.name).resolve()
                      if root.resolve() not in target.parents and target != root.resolve():
                          raise RuntimeError(f'Unsafe tar path: {m.name}')
                  tf.extractall(root)
                  print(f'Extracted tar payload with {len(members)} members')
                  applied = True
          except tarfile.ReadError:
              pass

          if not applied:
              try:
                  obj = json.loads(data.decode('utf-8'))
              except Exception as exc:
                  print('Decoded payload prefix:', repr(data[:300]))
                  raise RuntimeError('Unknown question-refactor payload format') from exc

              if isinstance(obj, dict) and isinstance(obj.get('files'), list):
                  records = obj['files']
              elif isinstance(obj, dict) and all(isinstance(k, str) for k in obj):
                  records = [{'path': k, 'content': v} for k, v in obj.items()]
              elif isinstance(obj, list):
                  records = obj
              else:
                  raise RuntimeError('Unsupported JSON payload shape')

              for rec in records:
                  path = rec['path']
                  target = (root / path).resolve()
                  if root.resolve() not in target.parents:
                      raise RuntimeError(f'Unsafe JSON path: {path}')
                  if rec.get('delete') is True or rec.get('content') is None:
                      if target.exists():
                          target.unlink()
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(rec['content'], encoding='utf-8')
              print(f'Applied JSON payload with {len(records)} records')

          import shutil
          if (root / '.bootstrap').exists():
              shutil.rmtree(root / '.bootstrap')
          workflow = root / '.github/workflows/apply-question-refactor.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate materialized pack
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_pack.py

      - name: Commit materialized refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'Refactor question contracts to atomic responsibilities'
          git push origin HEAD:feat/materialize-core-semantic-pack-v0.1
