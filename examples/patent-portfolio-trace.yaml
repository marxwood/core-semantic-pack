critical_boundaries:
- core.boundary.claim-not-evidence
- core.boundary.inference-not-finding
- core.boundary.finding-not-binding-decision
- core.boundary.review-not-binding
- core.boundary.capability-not-authority
- core.boundary.goal-not-desired-state
interpretive_note: Analysis authority permits recommendation only. A separate filing Authority, Binding
  act, Intent, Action, Actor, and governing Contract are required before the ExternalEffect.
